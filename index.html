<!DOCTYPE html>
<html lang="en">
<head>
  <meta name='impact-site-verification' value='859258e8-05b9-465c-9350-32e2b7eefbab'>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pure Prep</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=leaf8" />
  <link rel="icon" type="image/png" href="assets/favicon-32.png?v=leaf8" sizes="32x32" />
  <link rel="icon" type="image/png" href="assets/favicon-16.png?v=leaf8" sizes="16x16" />
  <link rel="icon" href="assets/favicon.ico?v=leaf8" sizes="any" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=leaf8" />
  <meta name="theme-color" content="#5a7a52" />

  <style>

    :root {
      --bg: #f4efe6;
      --bg-deep: #ebe4d6;
      --card: #fffaf2;
      --paper: #fbf7ef;
      --text: #2f3a2f;
      --muted: #6b7564;
      --accent: #5a7a52;
      --accent-deep: #3f5a3a;
      --sage: #c5d5bc;
      --sage-soft: rgba(90, 122, 82, 0.12);
      --moss: #6f8f64;
      --clay: #c4785a;
      --clay-soft: rgba(196, 120, 90, 0.14);
      --terracotta: #b86b4b;
      --linen: #e8e0d0;
      --border: #d9d0bd;
      --danger: #b54a3c;
      --ok: #4f7a48;
      --warn: #b8860b;
      --shadow: 0 8px 24px rgba(70, 55, 35, 0.08);
      --shadow-soft: 0 2px 10px rgba(70, 55, 35, 0.06);
      --radius: 16px;
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      background:
        radial-gradient(ellipse 120% 80% at 10% -10%, rgba(197, 213, 188, 0.55), transparent 50%),
        radial-gradient(ellipse 90% 70% at 100% 0%, rgba(232, 200, 170, 0.35), transparent 45%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(180, 160, 120, 0.12), transparent 50%),
        linear-gradient(165deg, #f7f2e8 0%, var(--bg) 40%, var(--bg-deep) 100%);
      background-attachment: fixed;
    }
    .shell {
      width: min(720px, 100%);
      background:
        linear-gradient(180deg, rgba(255,250,242,0.97), rgba(251,247,239,0.98)),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(217, 208, 189, 0.22) 28px
        );
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px 28px 28px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
      position: relative;
      overflow: hidden;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 92% 8%, rgba(90, 122, 82, 0.07), transparent 28%),
        radial-gradient(circle at 6% 94%, rgba(196, 120, 90, 0.06), transparent 30%);
      border-radius: inherit;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .leaf-mark {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      color: var(--accent);
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
      color: var(--accent-deep);
    }
    .lede {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 2px 0 10px;
      font-weight: 450;
    }
    .step-label {
      color: var(--moss);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .mp-progress {
      height: 8px;
      background: var(--linen);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid rgba(217, 208, 189, 0.7);
      box-shadow: inset 0 1px 2px rgba(70,55,35,0.06);
    }
    .mp-progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #7a9a6e, var(--moss) 55%, #8faf7e);
      border-radius: 99px;
      transition: width .25s ease;
      box-shadow: 0 0 8px rgba(111, 143, 100, 0.35);
    }
    .mp-q {
      font-family: var(--font-display);
      font-size: 1.28rem;
      font-weight: 600;
      margin: 0 0 16px;
      line-height: 1.35;
      color: var(--accent-deep);
    }
    .mp-input, select.mp-input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--paper);
      color: var(--text);
      font-size: 1.02rem;
      font-family: var(--font-body);
      box-shadow: var(--shadow-soft);
    }
    .mp-input:focus, select.mp-input:focus {
      outline: 2px solid var(--sage);
      border-color: var(--accent);
      background: #fff;
    }
    .mp-label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 10px 0 4px;
      font-weight: 600;
    }
    .mp-hint {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
      margin: 0;
    }
    .mp-options { display: flex; flex-direction: column; gap: 9px; }
    .mp-option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      background: var(--card);
      box-shadow: var(--shadow-soft);
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .mp-option:hover {
      border-color: var(--sage);
      background: #fffcf7;
    }
    .mp-option.selected {
      border-color: var(--accent);
      background: var(--sage-soft);
      box-shadow: 0 0 0 1px rgba(90, 122, 82, 0.2), var(--shadow-soft);
    }
    .mp-option input { accent-color: var(--accent); margin-top: 3px; }
    .mp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mp-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .mp-back, .mp-next, .mp-reroll {
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: var(--font-body);
      transition: filter .12s, background .12s, border-color .12s;
    }
    .mp-back {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .mp-back:disabled { opacity: 0.35; cursor: not-allowed; }
    .cta:disabled { opacity: 0.35; cursor: not-allowed; }
    .mp-next {
      background: linear-gradient(180deg, #6b8f62, var(--accent-deep));
      color: #f7faf5;
      border: 1px solid var(--accent-deep);
      margin-left: auto;
      box-shadow: 0 4px 12px rgba(63, 90, 58, 0.25);
    }
    .mp-next:hover { filter: brightness(1.06); }
    .mp-reroll {
      background: transparent;
      color: var(--terracotta);
      border: 1.5px solid var(--clay);
      box-shadow: none;
    }
    .mp-reroll:hover {
      background: var(--clay-soft);
      border-color: var(--terracotta);
    }
    .mp-error {
      color: var(--danger);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin: 8px 0 0;
    }
    .mp-goal, .mp-card, .mp-micro-row {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
    }
    .mp-goal {
      padding: 16px 18px;
      margin-bottom: 12px;
      background:
        linear-gradient(135deg, rgba(255,252,247,0.95), rgba(245,240,228,0.9));
    }
    .mp-cals {
      color: var(--accent-deep);
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 600;
    }
    .mp-cals-sm {
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
    }
    .mp-macros { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .mp-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .mp-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .mp-badge.ok {
      color: var(--ok);
      border-color: rgba(79, 122, 72, 0.35);
      background: rgba(90, 122, 82, 0.1);
    }
    .mp-badge.warn {
      color: #8a6a10;
      border-color: rgba(184, 134, 11, 0.35);
      background: rgba(240, 198, 116, 0.18);
    }
    .mp-card {
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .mp-suggest {
      color: var(--accent);
      font-weight: 500;
      font-family: var(--font-display);
    }
    .mp-ingredients {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .mp-ingredients li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px dashed rgba(217, 208, 189, 0.85);
    }
    .mp-ingredients li.totals {
      border-bottom: none;
      margin-top: 6px;
      font-weight: 600;
      color: var(--accent-deep);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .ing-name { flex: 1; }
    .ing-macros {
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .mp-note {
      color: var(--muted);
      font-size: 0.78rem;
      font-style: italic;
      margin: 8px 0 0;
    }
    .mp-result h2 {
      font-family: var(--font-display);
      font-size: 1.12rem;
      margin: 22px 0 10px;
      color: var(--accent-deep);
      letter-spacing: -0.01em;
    }
    .mp-result h2:first-child { margin-top: 0; }
    .mp-micros { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
    .mp-micro-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      align-items: center;
      padding: 10px 12px;
    }
    .mp-micro-meta { grid-column: 1; display: flex; flex-direction: column; gap: 2px; }
    .mp-micro-label { font-weight: 600; font-size: 0.88rem; }
    .mp-micro-amt { color: var(--muted); font-size: 0.75rem; }
    .mp-micro-bar {
      grid-column: 1 / -1;
      height: 7px;
      background: var(--linen);
      border-radius: 99px;
      overflow: hidden;
    }
    .mp-micro-bar > span { display: block; height: 100%; border-radius: 99px; }
    .mp-micro-bar > span.ok { background: var(--moss); }
    .mp-micro-bar > span.mid { background: #d4a84b; }
    .mp-micro-bar > span.low { background: #a8b0a0; }
    .mp-micro-bar > span.high { background: var(--danger); }

    .mp-nutrition-overview { margin-bottom: 14px; }
    .mp-stars {
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      color: var(--terracotta);
      margin-bottom: 8px;
    }
    .mp-overview-blurb {
      margin: 0;
      line-height: 1.45;
      color: var(--text);
      font-size: 0.95rem;
    }
    .mp-micro-pies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 12px;
      margin: 10px 0 14px;
    }
    .mp-micro-pie-card { text-align: center; }
    .mp-micro-pie {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 6px;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 6px var(--card);
      background: var(--linen);
    }
    /* pie center labels styled via .mp-pie-pct / .mp-pie-amt */
    .mp-micro-pie-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.2;
    }
    .mp-micro-note {
      margin: 4px 0 0;
      font-size: 0.68rem;
      color: var(--muted);
      font-style: italic;
      line-height: 1.25;
    }
    .mp-micro-expand {
      margin: 8px 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      background: var(--paper);
    }
    .mp-micro-expand summary {
      cursor: pointer;
      font-weight: 650;
      color: var(--accent-deep);
      padding: 4px 0;
    }
    .mp-micro-expand[open] summary { margin-bottom: 10px; }

    .mp-dual-macros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    @media (max-width: 720px) {
      .mp-dual-macros { grid-template-columns: 1fr; }
    }
    .mp-macro-panel { margin: 0; }
    .mp-panel-title {
      margin: 0 0 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-deep);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .mp-macro-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .mp-cals-block { flex: 1; min-width: 110px; }
    .mp-macro-pie {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .mp-macro-pie-hole {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background: var(--card);
      display: grid;
      place-content: center;
      text-align: center;
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .mp-macro-pie-hole strong {
      font-size: 0.95rem;
      color: var(--accent-deep);
      line-height: 1.1;
    }
    .mp-macro-pie-hole span {
      font-size: 0.65rem;
      color: var(--muted);
    }
    .mp-micro-pie {
      position: relative;
    }
    .mp-micro-pie .mp-pie-pct,
    .mp-micro-pie .mp-pie-amt {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-deep);
      background: var(--card);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      line-height: 1;
      text-align: center;
      padding: 2px;
    }
    .mp-micro-pie .mp-pie-amt { display: none; font-size: 0.58rem; }
    .mp-micro-pie:hover .mp-pie-pct,
    .mp-micro-pie:focus-within .mp-pie-pct { display: none; }
    .mp-micro-pie:hover .mp-pie-amt,
    .mp-micro-pie:focus-within .mp-pie-amt { display: grid; }


    .mp-micro-row > .mp-badge { grid-column: 2; grid-row: 1; justify-self: end; }
    .mp-grocery-list small.mp-buy-qty { color: var(--muted); font-weight: 400; }
    .mp-grocery { margin-bottom: 4px; }
    #app { position: relative; z-index: 1; }
    @media (max-width: 520px) {
      .shell { padding: 22px 16px; border-radius: 18px; }
      h1 { font-size: 1.4rem; }
      .mp-row { grid-template-columns: 1fr; }
    }
  

    /* App shell / dashboard */
    body.app-mode {
      align-items: stretch;
      justify-content: flex-start;
      padding: 0;
    }
    .app-frame {
      width: min(920px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 88px;
      position: relative;
    }
    .top-brand {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      margin: 0 0 14px;
    }
    .top-brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 600;
      color: var(--accent-deep);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .welcome {
      font-family: var(--font-display);
      font-size: 1.45rem;
      color: var(--accent-deep);
      margin: 4px 0 16px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .panel h2 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin: 0 0 10px;
      color: var(--accent-deep);
    }
    .panel-muted { color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(251, 247, 239, 0.94);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(8px);
      z-index: 40;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 68px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 650;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn.active {
      color: var(--accent-deep);
      background: var(--sage-soft);
      border-color: var(--sage);
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(180deg, #6f8f64, var(--accent-deep));
      color: #fff;
      font-weight: 650;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: var(--shadow-soft);
    }
    .cta.secondary {
      background: var(--paper);
      color: var(--accent-deep);
      border: 1px solid var(--border);
    }
    .macro-pie-wrap {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .macro-pie {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .macro-pie-hole {
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      background: var(--card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .macro-pie-hole strong { font-size: 1.05rem; color: var(--accent-deep); line-height: 1.1; }
    .macro-pie-hole span { font-size: 0.68rem; color: var(--muted); }
    .macro-legend { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
    .macro-legend i {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 3px;
      margin-right: 6px;
    }
    .meal-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 8px;
      overflow: hidden;
      background: var(--paper);
    }
    .meal-row summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 600;
      color: var(--accent-deep);
    }
    .meal-row summary::-webkit-details-marker { display: none; }
    .meal-row[open] summary { border-bottom: 1px solid var(--border); background: var(--sage-soft); }
    .meal-row .detail { padding: 10px 14px 12px; }
    .cal-chip {
      font-weight: 550;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .mp-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .mp-reroll-slot {
      flex-shrink: 0;
      padding: 6px 10px !important;
      font-size: 0.78rem !important;
    }
    .mp-days .mp-option { user-select: none; }
    .shell.onboard {
      width: min(720px, 100%);
      margin: 8px auto 0;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.78rem;
    }
    .cal-grid .dow { color: var(--muted); font-weight: 700; padding: 4px 0; }
    .cal-cell {
      aspect-ratio: 1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      color: var(--text);
      position: relative;
    }
    .cal-cell.muted { color: #b0a898; }
    .cal-cell.today {
      border-color: var(--accent);
      background: var(--sage-soft);
      font-weight: 700;
    }
    .cal-cell.coverage {
      background: rgba(196, 120, 90, 0.16);
      border-color: rgba(196, 120, 90, 0.35);
    }
