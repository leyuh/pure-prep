<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pure Prep</title>
  <link rel="icon" type="image/png" href="assets/favicon-32.png?v=leaf7" sizes="32x32" />
  <link rel="icon" type="image/png" href="assets/favicon-16.png?v=leaf7" sizes="16x16" />
  <link rel="icon" href="assets/favicon.ico?v=leaf7" sizes="any" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=leaf7" />
  <meta name="theme-color" content="#5a7a52" />

  <style>

    :root {
      --bg: #f4efe6;
      --bg-deep: #ebe4d6;
      --card: #fffaf2;
      --paper: #fbf7ef;
      --text: #2f3a2f;
      --muted: #6b7564;
      --accent: #5a7a52;
      --accent-deep: #3f5a3a;
      --sage: #c5d5bc;
      --sage-soft: rgba(90, 122, 82, 0.12);
      --moss: #6f8f64;
      --clay: #c4785a;
      --clay-soft: rgba(196, 120, 90, 0.14);
      --terracotta: #b86b4b;
      --linen: #e8e0d0;
      --border: #d9d0bd;
      --danger: #b54a3c;
      --ok: #4f7a48;
      --warn: #b8860b;
      --shadow: 0 8px 24px rgba(70, 55, 35, 0.08);
      --shadow-soft: 0 2px 10px rgba(70, 55, 35, 0.06);
      --radius: 16px;
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      background:
        radial-gradient(ellipse 120% 80% at 10% -10%, rgba(197, 213, 188, 0.55), transparent 50%),
        radial-gradient(ellipse 90% 70% at 100% 0%, rgba(232, 200, 170, 0.35), transparent 45%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(180, 160, 120, 0.12), transparent 50%),
        linear-gradient(165deg, #f7f2e8 0%, var(--bg) 40%, var(--bg-deep) 100%);
      background-attachment: fixed;
    }
    .shell {
      width: min(720px, 100%);
      background:
        linear-gradient(180deg, rgba(255,250,242,0.97), rgba(251,247,239,0.98)),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(217, 208, 189, 0.22) 28px
        );
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px 28px 28px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
      position: relative;
      overflow: hidden;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 92% 8%, rgba(90, 122, 82, 0.07), transparent 28%),
        radial-gradient(circle at 6% 94%, rgba(196, 120, 90, 0.06), transparent 30%);
      border-radius: inherit;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .leaf-mark {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      color: var(--accent);
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
      color: var(--accent-deep);
    }
    .lede {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 2px 0 10px;
      font-weight: 450;
    }
    .step-label {
      color: var(--moss);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .mp-progress {
      height: 8px;
      background: var(--linen);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid rgba(217, 208, 189, 0.7);
      box-shadow: inset 0 1px 2px rgba(70,55,35,0.06);
    }
    .mp-progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #7a9a6e, var(--moss) 55%, #8faf7e);
      border-radius: 99px;
      transition: width .25s ease;
      box-shadow: 0 0 8px rgba(111, 143, 100, 0.35);
    }
    .mp-q {
      font-family: var(--font-display);
      font-size: 1.28rem;
      font-weight: 600;
      margin: 0 0 16px;
      line-height: 1.35;
      color: var(--accent-deep);
    }
    .mp-input, select.mp-input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--paper);
      color: var(--text);
      font-size: 1.02rem;
      font-family: var(--font-body);
      box-shadow: var(--shadow-soft);
    }
    .mp-input:focus, select.mp-input:focus {
      outline: 2px solid var(--sage);
      border-color: var(--accent);
      background: #fff;
    }
    .mp-label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 10px 0 4px;
      font-weight: 600;
    }
    .mp-hint {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
      margin: 0;
    }
    .mp-options { display: flex; flex-direction: column; gap: 9px; }
    .mp-option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      background: var(--card);
      box-shadow: var(--shadow-soft);
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .mp-option:hover {
      border-color: var(--sage);
      background: #fffcf7;
    }
    .mp-option.selected {
      border-color: var(--accent);
      background: var(--sage-soft);
      box-shadow: 0 0 0 1px rgba(90, 122, 82, 0.2), var(--shadow-soft);
    }
    .mp-option input { accent-color: var(--accent); margin-top: 3px; }
    .mp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mp-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .mp-back, .mp-next, .mp-reroll {
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: var(--font-body);
      transition: filter .12s, background .12s, border-color .12s;
    }
    .mp-back {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .mp-back:disabled { opacity: 0.35; cursor: not-allowed; }
    .mp-next {
      background: linear-gradient(180deg, #6b8f62, var(--accent-deep));
      color: #f7faf5;
      border: 1px solid var(--accent-deep);
      margin-left: auto;
      box-shadow: 0 4px 12px rgba(63, 90, 58, 0.25);
    }
    .mp-next:hover { filter: brightness(1.06); }
    .mp-reroll {
      background: transparent;
      color: var(--terracotta);
      border: 1.5px solid var(--clay);
      box-shadow: none;
    }
    .mp-reroll:hover {
      background: var(--clay-soft);
      border-color: var(--terracotta);
    }
    .mp-error {
      color: var(--danger);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin: 8px 0 0;
    }
    .mp-goal, .mp-card, .mp-micro-row {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
    }
    .mp-goal {
      padding: 16px 18px;
      margin-bottom: 12px;
      background:
        linear-gradient(135deg, rgba(255,252,247,0.95), rgba(245,240,228,0.9));
    }
    .mp-cals {
      color: var(--accent-deep);
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 600;
    }
    .mp-cals-sm {
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
    }
    .mp-macros { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .mp-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .mp-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .mp-badge.ok {
      color: var(--ok);
      border-color: rgba(79, 122, 72, 0.35);
      background: rgba(90, 122, 82, 0.1);
    }
    .mp-badge.warn {
      color: #8a6a10;
      border-color: rgba(184, 134, 11, 0.35);
      background: rgba(240, 198, 116, 0.18);
    }
    .mp-card {
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .mp-suggest {
      color: var(--accent);
      font-weight: 500;
      font-family: var(--font-display);
    }
    .mp-ingredients {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .mp-ingredients li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px dashed rgba(217, 208, 189, 0.85);
    }
    .mp-ingredients li.totals {
      border-bottom: none;
      margin-top: 6px;
      font-weight: 600;
      color: var(--accent-deep);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .ing-name { flex: 1; }
    .ing-macros {
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .mp-note {
      color: var(--muted);
      font-size: 0.78rem;
      font-style: italic;
      margin: 8px 0 0;
    }
    .mp-result h2 {
      font-family: var(--font-display);
      font-size: 1.12rem;
      margin: 22px 0 10px;
      color: var(--accent-deep);
      letter-spacing: -0.01em;
    }
    .mp-result h2:first-child { margin-top: 0; }
    .mp-micros { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
    .mp-micro-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      align-items: center;
      padding: 10px 12px;
    }
    .mp-micro-meta { grid-column: 1; display: flex; flex-direction: column; gap: 2px; }
    .mp-micro-label { font-weight: 600; font-size: 0.88rem; }
    .mp-micro-amt { color: var(--muted); font-size: 0.75rem; }
    .mp-micro-bar {
      grid-column: 1 / -1;
      height: 7px;
      background: var(--linen);
      border-radius: 99px;
      overflow: hidden;
    }
    .mp-micro-bar > span { display: block; height: 100%; border-radius: 99px; }
    .mp-micro-bar > span.ok { background: var(--moss); }
    .mp-micro-bar > span.mid { background: #d4a84b; }
    .mp-micro-bar > span.low { background: #a8b0a0; }
    .mp-micro-bar > span.high { background: var(--danger); }

    .mp-nutrition-overview { margin-bottom: 14px; }
    .mp-stars {
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      color: var(--terracotta);
      margin-bottom: 8px;
    }
    .mp-overview-blurb {
      margin: 0;
      line-height: 1.45;
      color: var(--text);
      font-size: 0.95rem;
    }
    .mp-micro-pies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 12px;
      margin: 10px 0 14px;
    }
    .mp-micro-pie-card { text-align: center; }
    .mp-micro-pie {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 6px;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 6px var(--card);
      background: var(--linen);
    }
    /* pie center labels styled via .mp-pie-pct / .mp-pie-amt */
    .mp-micro-pie-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.2;
    }
    .mp-micro-note {
      margin: 4px 0 0;
      font-size: 0.68rem;
      color: var(--muted);
      font-style: italic;
      line-height: 1.25;
    }
    .mp-micro-expand {
      margin: 8px 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      background: var(--paper);
    }
    .mp-micro-expand summary {
      cursor: pointer;
      font-weight: 650;
      color: var(--accent-deep);
      padding: 4px 0;
    }
    .mp-micro-expand[open] summary { margin-bottom: 10px; }

    .mp-dual-macros {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    @media (max-width: 720px) {
      .mp-dual-macros { grid-template-columns: 1fr; }
    }
    .mp-macro-panel { margin: 0; }
    .mp-panel-title {
      margin: 0 0 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-deep);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .mp-macro-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .mp-cals-block { flex: 1; min-width: 110px; }
    .mp-macro-pie {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .mp-macro-pie-hole {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background: var(--card);
      display: grid;
      place-content: center;
      text-align: center;
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .mp-macro-pie-hole strong {
      font-size: 0.95rem;
      color: var(--accent-deep);
      line-height: 1.1;
    }
    .mp-macro-pie-hole span {
      font-size: 0.65rem;
      color: var(--muted);
    }
    .mp-micro-pie {
      position: relative;
    }
    .mp-micro-pie .mp-pie-pct,
    .mp-micro-pie .mp-pie-amt {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-deep);
      background: var(--card);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      line-height: 1;
      text-align: center;
      padding: 2px;
    }
    .mp-micro-pie .mp-pie-amt { display: none; font-size: 0.58rem; }
    .mp-micro-pie:hover .mp-pie-pct,
    .mp-micro-pie:focus-within .mp-pie-pct { display: none; }
    .mp-micro-pie:hover .mp-pie-amt,
    .mp-micro-pie:focus-within .mp-pie-amt { display: grid; }


    .mp-micro-row > .mp-badge { grid-column: 2; grid-row: 1; justify-self: end; }
    .mp-grocery-list small.mp-buy-qty { color: var(--muted); font-weight: 400; }
    .mp-grocery { margin-bottom: 4px; }
    #app { position: relative; z-index: 1; }
    @media (max-width: 520px) {
      .shell { padding: 22px 16px; border-radius: 18px; }
      h1 { font-size: 1.4rem; }
      .mp-row { grid-template-columns: 1fr; }
    }
  

    /* App shell / dashboard */
    body.app-mode {
      align-items: stretch;
      justify-content: flex-start;
      padding: 0;
    }
    .app-frame {
      width: min(920px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 88px;
      position: relative;
    }
    .top-brand {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      margin: 0 0 14px;
    }
    .top-brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 600;
      color: var(--accent-deep);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .welcome {
      font-family: var(--font-display);
      font-size: 1.45rem;
      color: var(--accent-deep);
      margin: 4px 0 16px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .panel h2 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin: 0 0 10px;
      color: var(--accent-deep);
    }
    .panel-muted { color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(251, 247, 239, 0.94);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(8px);
      z-index: 40;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 68px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 650;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn.active {
      color: var(--accent-deep);
      background: var(--sage-soft);
      border-color: var(--sage);
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(180deg, #6f8f64, var(--accent-deep));
      color: #fff;
      font-weight: 650;
      cursor: pointer;
      font-size: 0.95rem;
      box-shadow: var(--shadow-soft);
    }
    .cta.secondary {
      background: var(--paper);
      color: var(--accent-deep);
      border: 1px solid var(--border);
    }
    .macro-pie-wrap {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .macro-pie {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .macro-pie-hole {
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      background: var(--card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .macro-pie-hole strong { font-size: 1.05rem; color: var(--accent-deep); line-height: 1.1; }
    .macro-pie-hole span { font-size: 0.68rem; color: var(--muted); }
    .macro-legend { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
    .macro-legend i {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 3px;
      margin-right: 6px;
    }
    .meal-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 8px;
      overflow: hidden;
      background: var(--paper);
    }
    .meal-row summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 600;
      color: var(--accent-deep);
    }
    .meal-row summary::-webkit-details-marker { display: none; }
    .meal-row[open] summary { border-bottom: 1px solid var(--border); background: var(--sage-soft); }
    .meal-row .detail { padding: 10px 14px 12px; }
    .cal-chip {
      font-weight: 550;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .mp-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .mp-reroll-slot {
      flex-shrink: 0;
      padding: 6px 10px !important;
      font-size: 0.78rem !important;
    }
    .mp-days .mp-option { user-select: none; }
    .shell.onboard {
      width: min(720px, 100%);
      margin: 8px auto 0;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.78rem;
    }
    .cal-grid .dow { color: var(--muted); font-weight: 700; padding: 4px 0; }
    .cal-cell {
      aspect-ratio: 1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      color: var(--text);
      position: relative;
    }
    .cal-cell.muted { color: #b0a898; }
    .cal-cell.today {
      border-color: var(--accent);
      background: var(--sage-soft);
      font-weight: 700;
    }
    .cal-cell.coverage {
      background: rgba(196, 120, 90, 0.16);
      border-color: rgba(196, 120, 90, 0.35);
    }
    .cal-cell.order-day {
      background: var(--clay-soft);
      border-color: var(--terracotta);
      font-weight: 700;
    }
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cal-head button {
      border: 1px solid var(--border);
      background: var(--paper);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--accent-deep);
      font-weight: 650;
    }
    .inv-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.92rem;
    }
    .inv-item:last-child { border-bottom: none; }
    .screen-hidden { display: none !important; }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--sage-soft);
      color: var(--accent-deep);
      font-size: 0.75rem;
      font-weight: 650;
    }

  
    .brand-mark {
      display: block;
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
      flex-shrink: 0;
    }
    .brand-row .brand-mark { width: 32px; height: 32px; }
  </style>
</head>
<body>
  <div class="app-frame" id="app-root">
    <div class="top-brand">
      <img src="assets/icon-mark.png?v=leaf7" alt="" class="brand-mark" width="40" height="40" />
      <h1>Pure Prep</h1>
    </div>

    <div id="screen-home"></div>
    <div id="screen-inventory" class="screen-hidden"></div>
    <div id="screen-schedule" class="screen-hidden"></div>
    <div id="screen-onboard" class="screen-hidden">
      <div class="shell onboard">
        <div class="brand">
          <div class="brand-row">
            <img src="assets/icon-mark.png?v=leaf7" alt="" class="brand-mark" width="32" height="32" />
            <h1>Onboarding</h1>
          </div>
          <p class="lede">Grow a week of simple meals</p>
        </div>
        <div id="onboard-root"></div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Main">
      <button type="button" class="nav-btn active" data-screen="home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
        Home
      </button>
      <button type="button" class="nav-btn" data-screen="inventory" title="Inventory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16l-1.2 12.2A2 2 0 0 1 16.81 21H7.19a2 2 0 0 1-1.99-1.8L4 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
        Inventory
      </button>
      <button type="button" class="nav-btn" data-screen="schedule" title="Schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3.5V7M16 3.5V7M3.5 10h17"/></svg>
        Schedule
      </button>
      <button type="button" class="nav-btn" data-screen="onboard" title="Plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v16M4 12h16"/><circle cx="12" cy="12" r="9"/></svg>
        Plan
      </button>
    </nav>
  </div>
  <script src="onboarding.js?v=doc13"></script>
  <script>

(function () {
  "use strict";
  const M = window.MealPlanOnboarding;
  const STORAGE_KEY = "purePrepState";
  const DAY_IDS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"]; // JS getDay()

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return Object.assign(defaultState(), JSON.parse(raw));
    } catch (_) {
      return defaultState();
    }
  }
  function defaultState() {
    return {
      answers: null,
      plan: null,
      inventory: [],
      lastOrderedAt: null,
      nextOrderDate: null,
      groceryList: null,
      groceriesConfirmed: false,
      lastDepletedDate: null,
    };
  }
  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function greeting() {
    const h = new Date().getHours();
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    return "Good evening";
  }

  function cadenceDays(cadence) {
    if (cadence === "every_other_week") return 14;
    if (cadence === "monthly") return 28;
    return 7;
  }

  function addDays(iso, n) {
    const d = new Date(iso + "T12:00:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function formatNice(iso) {
    if (!iso) return "—";
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  }

  function isPlanWeekday(selectedDays, dateObj) {
    if (!selectedDays || !selectedDays.length) return true;
    const id = DAY_IDS[dateObj.getDay()];
    return selectedDays.indexOf(id) !== -1;
  }

  /** Deplete inventory for each elapsed plan day since lastDepletedDate / lastOrderedAt. */
  function depleteInventory(state) {
    if (!state.groceriesConfirmed || !state.inventory || !state.inventory.length || !state.plan) return state;
    const start = state.lastDepletedDate || state.lastOrderedAt;
    if (!start) return state;
    const selected = (state.answers && state.answers.selectedDays) || state.plan.selectedDays || [];
    const today = todayISO();
    let cursor = addDays(start, 1); // deplete for days after last marked
    const dailyNeed = {};
    (state.plan.schedule || []).forEach((slot) => {
      (slot.suggestion.ingredients || []).forEach((ing) => {
        if (!ing._key || ing._note) return;
        dailyNeed[ing._key] = (dailyNeed[ing._key] || 0) + (ing._qty || 0);
      });
    });
    let changed = false;
    while (cursor <= today) {
      const d = new Date(cursor + "T12:00:00");
      if (isPlanWeekday(selected, d)) {
        state.inventory = state.inventory.map((item) => {
          const need = dailyNeed[item.key] || 0;
          if (need <= 0) return item;
          changed = true;
          const left = Math.max(0, Math.round((item.qtyRemaining - need) * 100) / 100);
          return Object.assign({}, item, { qtyRemaining: left });
        });
      }
      cursor = addDays(cursor, 1);
    }
    state.lastDepletedDate = today;
    if (changed) saveState(state);
    return state;
  }

  function confirmGroceries(state) {
    const list = (state.plan && state.plan.grocery) || state.groceryList;
    if (!list) return state;
    const now = todayISO();
    state.inventory = list.items.map((it) => ({
      key: it.key,
      name: it.name,
      unit: it.unit,
      qtyRemaining: it.qty,
      qtyLabel: it.qtyLabel,
      initialQty: it.qty,
    }));
    state.groceryList = list;
    state.lastOrderedAt = now;
    state.lastDepletedDate = now;
    state.groceriesConfirmed = true;
    const span = cadenceDays(state.answers && state.answers.cadence);
    state.nextOrderDate = addDays(now, span);
    saveState(state);
    return state;
  }

  function pieStyle(macros) {
    const p = Number(macros.p) || 0;
    const c = Number(macros.c) || 0;
    const f = Number(macros.f) || 0;
    const pEnd = p;
    const cEnd = p + c;
    // hollow ring via mask-like layered gradients: use conic on outer, hole overlays
    return (
      "background: conic-gradient(" +
      "#5a7a52 0 " + pEnd + "%, " +
      "#c4785a " + pEnd + "% " + cEnd + "%, " +
      "#b8a06a " + cEnd + "% 100%)"
    );
  }

  let state = depleteInventory(loadState());
  let screen = "home";
  let calCursor = new Date();
  calCursor.setDate(1);

  const els = {
    home: document.getElementById("screen-home"),
    inventory: document.getElementById("screen-inventory"),
    schedule: document.getElementById("screen-schedule"),
    onboard: document.getElementById("screen-onboard"),
    onboardRoot: document.getElementById("onboard-root"),
  };

  function setScreen(name) {
    screen = name;
    ["home", "inventory", "schedule", "onboard"].forEach((k) => {
      els[k].classList.toggle("screen-hidden", k !== name);
    });
    document.querySelectorAll(".nav-btn").forEach((b) => {
      b.classList.toggle("active", b.getAttribute("data-screen") === name);
    });
    if (name === "home") renderHome();
    if (name === "inventory") renderInventory();
    if (name === "schedule") renderSchedule();
    if (name === "onboard") startOnboarding();
  }

  function renderHome() {
    const root = els.home;
    const g = greeting();
    let weekHtml = "";
    if (!state.plan) {
      weekHtml = `
        <p class="panel-muted">No meal plan yet. Fill out the onboarding questionnaire to grow your week of simple meals.</p>
        <button type="button" class="cta" id="startOnboard">Start questionnaire</button>`;
    } else {
      const p = state.plan;
      const daysLabel = (p.selectedDays || [])
        .map((id) => {
          const d = M.DAYS_OF_WEEK.find((x) => x.id === id);
          return d ? d.short : id;
        })
        .join(", ");
      const meals = (p.schedule || [])
        .map((slot) => {
          const s = slot.suggestion;
          const lis = (s.ingredients || [])
            .map((ing) => {
              return `<li><span class="ing-name">${ing.label}</span><span class="ing-macros">${ing.kcal} kcal · ${Math.round(ing.p)}p / ${Math.round(ing.c)}c / ${Math.round(ing.f)}f</span></li>`;
            })
            .join("");
          return `<details class="meal-row">
            <summary><span>${slot.name}: ${s.title}</span><span class="cal-chip">${s.totals.kcal} cal</span></summary>
            <div class="detail">
              <ul class="mp-ingredients">${lis}
                <li class="totals"><span class="ing-name">Meal total</span><span class="ing-macros">${s.totals.kcal} kcal · ${s.totals.p}p / ${s.totals.c}c / ${s.totals.f}f</span></li>
              </ul>
            </div>
          </details>`;
        })
        .join("");
      weekHtml = `
        <div class="macro-pie-wrap">
          <div class="macro-pie" style="${pieStyle(p.daily.macros)}">
            <div class="macro-pie-hole"><strong>${p.daily.calories}</strong><span>cals</span></div>
          </div>
          <div class="macro-legend">
            <div><i style="background:#5a7a52"></i>Protein ${p.daily.macros.p}% · ${p.daily.protein_g}g</div>
            <div><i style="background:#c4785a"></i>Carbs ${p.daily.macros.c}% · ${p.daily.carbs_g}g</div>
            <div><i style="background:#b8a06a"></i>Fat ${p.daily.macros.f}% · ${p.daily.fat_g}g</div>
            <div style="margin-top:6px"><span class="pill">${p.daysPerWeek} days/week</span> ${daysLabel ? "· " + daysLabel : ""}</div>
          </div>
        </div>
        <div style="margin-top:12px">${meals}</div>
        <button type="button" class="cta secondary" id="redoOnboard" style="margin-top:12px">Update questionnaire</button>`;
    }

    let invPanel = "";
    if (!state.plan) {
      invPanel = `<p class="panel-muted">Inventory is empty until you complete onboarding.</p>`;
    } else if (!state.groceriesConfirmed) {
      invPanel = `
        <p class="panel-muted">Order the groceries for your <strong>${(state.answers && state.answers.cadence) || "weekly"}</strong> shopping window, then confirm below.</p>
        <button type="button" class="cta" id="confirmGroceries">Confirm groceries ordered</button>
        <button type="button" class="cta secondary" id="viewInv" style="margin-left:8px">View list</button>`;
    } else {
      const left = (state.inventory || []).filter((i) => i.qtyRemaining > 0).length;
      invPanel = `<p class="panel-muted">${left} items still in stock. <button type="button" class="cta secondary" id="goInv">Open inventory</button></p>`;
    }

    const schedPanel = state.nextOrderDate
      ? `<p class="panel-muted">Next grocery order: <strong>${formatNice(state.nextOrderDate)}</strong></p>`
      : `<p class="panel-muted">No order scheduled yet.${state.plan ? " Confirm groceries to set a date." : ""}</p>`;

    root.innerHTML = `
      <p class="welcome">${g} 🌿</p>
      <section class="panel"><h2>Week at a glance</h2>${weekHtml}</section>
      <section class="panel"><h2>Inventory</h2>${invPanel}</section>
      <section class="panel"><h2>Schedule</h2>${schedPanel}
        <button type="button" class="cta secondary" id="goSched">Open calendar</button>
      </section>`;

    const start = root.querySelector("#startOnboard");
    if (start) start.onclick = () => setScreen("onboard");
    const redo = root.querySelector("#redoOnboard");
    if (redo) redo.onclick = () => setScreen("onboard");
    const conf = root.querySelector("#confirmGroceries");
    if (conf) conf.onclick = () => { state = confirmGroceries(state); renderHome(); };
    const goInv = root.querySelector("#goInv") || root.querySelector("#viewInv");
    if (goInv) goInv.onclick = () => setScreen("inventory");
    const goSched = root.querySelector("#goSched");
    if (goSched) goSched.onclick = () => setScreen("schedule");
  }

  function renderInventory() {
    const root = els.inventory;
    if (!state.plan) {
      root.innerHTML = `<section class="panel"><h2>Inventory</h2><p class="panel-muted">Complete the questionnaire first.</p>
        <button type="button" class="cta" id="toOn">Start questionnaire</button></section>`;
      root.querySelector("#toOn").onclick = () => setScreen("onboard");
      return;
    }
    if (!state.groceriesConfirmed) {
      const items = ((state.plan.grocery && state.plan.grocery.items) || []).map((it) =>
        `<div class="inv-item"><span>${it.name}<br/><small class="panel-muted">buy ${it.qtyLabel}</small></span><span>$${it.lineTotal.toFixed(2)}</span></div>`
      ).join("");
      root.innerHTML = `<section class="panel"><h2>Suggested groceries</h2>
        <p class="panel-muted">Confirm once you've ordered these for your shopping window.</p>
        ${items || "<p class='panel-muted'>No items.</p>"}
        <button type="button" class="cta" id="confirmGroceries2">Confirm groceries ordered</button>
      </section>`;
      root.querySelector("#confirmGroceries2").onclick = () => { state = confirmGroceries(state); renderInventory(); };
      return;
    }
    const rows = (state.inventory || []).map((it) => {
      const pct = it.initialQty ? Math.round((it.qtyRemaining / it.initialQty) * 100) : 0;
      return `<div class="inv-item"><span>${it.name}<br/><small class="panel-muted">${it.qtyRemaining} ${it.unit} left (${pct}%)</small></span></div>`;
    }).join("");
    root.innerHTML = `<section class="panel"><h2>Your inventory</h2>
      <p class="panel-muted">Depletes on plan days as calendar days pass (local).</p>
      ${rows || "<p class='panel-muted'>Empty.</p>"}
      <button type="button" class="cta secondary" id="reconfirm" style="margin-top:10px">Re-order / reset from grocery list</button>
    </section>`;
    root.querySelector("#reconfirm").onclick = () => { state = confirmGroceries(state); renderInventory(); };
  }

  function renderSchedule() {
    const root = els.schedule;
    const y = calCursor.getFullYear();
    const m = calCursor.getMonth();
    const monthName = calCursor.toLocaleString(undefined, { month: "long", year: "numeric" });
    const firstDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const today = todayISO();
    const ordered = state.lastOrderedAt;
    const next = state.nextOrderDate;
    const coverageEnd = next ? addDays(next, -1) : null;

    let cells = "";
    for (let i = 0; i < firstDow; i++) cells += `<div class="cal-cell muted"></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const iso = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      const cls = ["cal-cell"];
      if (iso === today) cls.push("today");
      if (iso === next) cls.push("order-day");
      else if (ordered && coverageEnd && iso >= ordered && iso <= coverageEnd) cls.push("coverage");
      cells += `<div class="${cls.join(" ")}" title="${iso}">${day}</div>`;
    }

    root.innerHTML = `
      <section class="panel">
        <h2>Schedule</h2>
        <p class="panel-muted">Next order: <strong>${formatNice(next)}</strong>
          ${ordered ? " · groceries last from " + formatNice(ordered) + " through " + formatNice(coverageEnd) : ""}</p>
        <div class="cal-head">
          <button type="button" id="prevM" aria-label="Previous month">←</button>
          <strong>${monthName}</strong>
          <button type="button" id="nextM" aria-label="Next month">→</button>
        </div>
        <div class="cal-grid">
          <div class="dow">Su</div><div class="dow">Mo</div><div class="dow">Tu</div><div class="dow">We</div>
          <div class="dow">Th</div><div class="dow">Fr</div><div class="dow">Sa</div>
          ${cells}
        </div>
        <p class="panel-muted" style="margin-top:10px">Terracotta = grocery coverage · outlined = next order · sage ring = today</p>
      </section>`;
    root.querySelector("#prevM").onclick = () => { calCursor.setMonth(calCursor.getMonth() - 1); renderSchedule(); };
    root.querySelector("#nextM").onclick = () => { calCursor.setMonth(calCursor.getMonth() + 1); renderSchedule(); };
  }

  let onboardingApi = null;
  function startOnboarding() {
    els.onboardRoot.innerHTML = "";
    onboardingApi = M.createOnboarding(els.onboardRoot);
  }

  document.getElementById("app-root").addEventListener("pureprep-goto", (e) => {
    const d = e.detail || {};
    if (d.save && d.plan) {
      state.plan = d.plan;
      state.answers = d.answers || state.answers;
      state.groceryList = d.plan.grocery || state.groceryList;
      state.groceriesConfirmed = false;
      state.inventory = [];
      state.lastOrderedAt = null;
      state.nextOrderDate = null;
      state.lastDepletedDate = null;
      // seed next order estimate from cadence without confirming
      if (state.answers && state.answers.cadence) {
        state.nextOrderDate = addDays(todayISO(), cadenceDays(state.answers.cadence));
      }
      saveState(state);
    }
    setScreen(d.screen || "home");
  });

  document.getElementById("app-root").addEventListener("onboarding-complete", (e) => {
    // also handled via pureprep-goto from Save & close
    const d = e.detail || {};
    if (d.plan && d.save) {
      state.plan = d.plan;
      state.answers = d.answers;
      state.groceryList = d.plan.grocery;
      saveState(state);
    }
  });

  document.querySelectorAll(".nav-btn").forEach((btn) => {
    btn.addEventListener("click", () => setScreen(btn.getAttribute("data-screen")));
  });

  document.body.classList.add("app-mode");
  setScreen("home");
})();

  </script>
</body>
