  <script>

(function () {
  "use strict";
  const M = window.MealPlanOnboarding;
  const STORAGE_KEY = "purePrepState";
  const DAY_IDS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"]; // JS getDay()

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const st = Object.assign(defaultState(), JSON.parse(raw));
      // One row per store product (older saves could hold hard_boiled_egg + egg, pb_tsp + pb_tbsp…).
      st.inventory = M.canonicalizeInventory(st.inventory || []);
      if (!Array.isArray(st.inStock)) st.inStock = [];
      return st;
    } catch (_) {
      return defaultState();
    }
  }
  function defaultState() {
    return {
      answers: null,
      plan: null,
      planBlocks: [],
      inventory: [],
      lastOrderedAt: null,
      nextOrderDate: null,
      groceryList: null,
      groceriesConfirmed: false,
      lastDepletedDate: null,
      scheduledWeeks: [],
      groceryCoveredWeeks: [],
      _pendingScheduleFromOffset: null,
      profileCompleted: false,
      profileUpdatedAt: null,
      inStock: [], // [{ key, name, unit, qty }] saved "I already have" amounts for the next order
      inStockUpdatedAt: null,
    };
  }
  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  /* ── Profile (questionnaire answers) ──
   * state.answers is the live profile: it only drives plans scheduled from now on.
   * Every planBlock carries its own `profile` snapshot (the settings it was
   * generated with) and its plan stores its own targets, so editing the profile
   * never touches weeks that are already scheduled. */
  const PROFILE_KEYS = [
    "budget", "cadence", "calorieMode", "calories", "weightLbs", "weightGoal",
    "activity", "mealOption", "meals", "snacks", "daysPerWeek", "selectedDays",
  ];
  const DAY_ORDER = M.DAYS_OF_WEEK.map((d) => d.id);

  function pickProfile(a) {
    if (!a) return null;
    const o = {};
    PROFILE_KEYS.forEach((k) => {
      if (a[k] === undefined) return;
      o[k] = Array.isArray(a[k]) ? a[k].slice() : a[k];
    });
    return o;
  }

  /** Normalized copy with derived values filled in (meals/snacks, days, help-path calories). */
  function normalizeProfile(a) {
    const n = pickProfile(a) || {};
    if (n.budget != null && n.budget !== "") n.budget = Number(n.budget);
    if (n.calories != null && n.calories !== "") n.calories = Number(n.calories);
    if (n.weightLbs === "" || n.weightLbs == null) n.weightLbs = null;
    else n.weightLbs = Number(n.weightLbs);
    if (!n.activity) n.activity = null;
    if (!n.weightGoal) n.weightGoal = n.calorieMode === "help" ? null : "maintain"; // known path defaults to maintain (same as questionnaire)
    if (n.mealOption && M.MEAL_OPTIONS[n.mealOption]) {
      n.meals = M.MEAL_OPTIONS[n.mealOption].meals;
      n.snacks = M.MEAL_OPTIONS[n.mealOption].snacks;
    }
    if (Array.isArray(n.selectedDays)) {
      n.selectedDays = DAY_ORDER.filter((id) => n.selectedDays.indexOf(id) !== -1);
      n.daysPerWeek = n.selectedDays.length;
    }
    if (n.calorieMode === "help" && n.weightLbs && n.weightGoal && n.activity) {
      n.calories = M.estimateCalories(n.weightLbs, n.weightGoal, n.activity);
    }
    return n;
  }

  /** Comparable fingerprint (ignores help-path fields while on the known-calories path). */
  function profileKey(a) {
    const n = normalizeProfile(a);
    return JSON.stringify(PROFILE_KEYS.map((k) => {
      if (n.calorieMode !== "help" && (k === "weightLbs" || k === "activity")) return null;
      return n[k] === undefined ? null : n[k];
    }));
  }
  function sameProfile(a, b) {
    return profileKey(a) === profileKey(b);
  }

  /**
   * Best-effort profile a plan was generated with: its own stored settings
   * (budget, cadence, days, meal structure, calories, macro preset) layered on
   * top of `fallback` for fields a plan does not record.
   */
  function profileFromPlan(plan, fallback) {
    const base = pickProfile(fallback) || {};
    if (!plan) return base;
    if (plan.budget != null) base.budget = plan.budget;
    if (plan.cadence) base.cadence = plan.cadence;
    if (Array.isArray(plan.selectedDays) && plan.selectedDays.length) {
      base.selectedDays = plan.selectedDays.slice();
      base.daysPerWeek = plan.selectedDays.length;
    }
    if (Array.isArray(plan.schedule) && plan.schedule.length) {
      const meals = plan.schedule.filter((s) => s.kind === "meal").length;
      const snacks = plan.schedule.filter((s) => s.kind === "snack").length;
      const opt = Object.keys(M.MEAL_OPTIONS).find((k) =>
        M.MEAL_OPTIONS[k].meals === meals && M.MEAL_OPTIONS[k].snacks === snacks);
      if (opt) { base.mealOption = opt; base.meals = meals; base.snacks = snacks; }
    }
    const macros = plan.daily && plan.daily.macros;
    if (macros) {
      const goal = ["lose", "maintain", "gain"].find((g) => {
        const m = M.macrosFromWeightGoal(g);
        return m.p === macros.p && m.c === macros.c && m.f === macros.f;
      });
      if (goal) base.weightGoal = goal;
    }
    const cal = plan.daily && plan.daily.calories;
    if (cal) {
      if (base.calorieMode === "help") {
        const est = (base.weightLbs && base.weightGoal && base.activity)
          ? M.estimateCalories(base.weightLbs, base.weightGoal, base.activity) : null;
        if (est !== cal) { base.calorieMode = "known"; base.calories = cal; }
      } else {
        base.calories = cal;
      }
    }
    return base;
  }

  /** True when a plan's stored settings match `profile` (no regeneration needed). */
  function planMatchesProfile(plan, profile) {
    if (!plan || !profile) return false;
    return sameProfile(profileFromPlan(plan, profile), profile);
  }

  function hasCompletedProfile(st) {
    return !!(st && st.answers && (st.plan || (st.planBlocks && st.planBlocks.length)));
  }

  function blockForWeekISO(st, weekISO) {
    const blocks = (st && st.planBlocks) || [];
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b && b.plan && b.weeks && b.weeks.indexOf(weekISO) !== -1) return b;
    }
    return null;
  }

  /** Settings snapshot for an already-scheduled week (never the live profile when a snapshot exists). */
  function profileForWeekISO(st, weekISO) {
    const b = blockForWeekISO(st, weekISO);
    if (b && b.profile) return pickProfile(b.profile);
    if (b && b.plan) return profileFromPlan(b.plan, st.answers);
    return null;
  }

  /** Cadence the active (latest) plan was generated with. */
  function activePlanCadence(st) {
    return (st.plan && st.plan.cadence) || (st.answers && st.answers.cadence) || "weekly";
  }

  function greeting() {
    const h = new Date().getHours();
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    return "Good evening";
  }

  function cadenceDays(cadence) {
    if (cadence === "every_other_week") return 14;
    if (cadence === "monthly") return 28;
    return 7;
  }

  /** Grocery cadence → how many weeks the current meal plan covers. */
  function cadenceWeeks(cadence) {
    if (cadence === "every_other_week") return 2;
    if (cadence === "monthly") return 4;
    return 1;
  }

  /** Drive Onboarding: first meal plan begins on the soonest Sunday (today if Sunday, else next). */
  function soonestSundayWeekOffset() {
    return new Date().getDay() === 0 ? 0 : 1;
  }

  function earliestScheduledWeek(st) {
    const weeks = (st && st.scheduledWeeks) || [];
    if (!weeks.length) return weekStartISO(soonestSundayWeekOffset());
    return weeks.slice().sort()[0];
  }

  /** Offset (relative to this week's Sunday) for a weekStartISO string. */
  function offsetFromWeekISO(weekISO) {
    if (!weekISO) return soonestSundayWeekOffset();
    const now = new Date();
    const currentStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    currentStart.setDate(currentStart.getDate() - currentStart.getDay());
    const parts = String(weekISO).split("-");
    const target = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    return Math.round((target - currentStart) / (7 * 24 * 60 * 60 * 1000));
  }

  /**
   * Earliest weekOffset the week-at-a-glance toggle may show.
   * Once a plan is scheduled, never go earlier than that first plan week.
   * With no scheduled weeks yet, use soonest Sunday (product default) or 0.
   */
  function minWeekOffset(st) {
    const weeks = (st && st.scheduledWeeks) || [];
    if (weeks.length) return offsetFromWeekISO(weeks.slice().sort()[0]);
    if (st && st.plan) return soonestSundayWeekOffset();
    return 0;
  }

  function weekStartISO(offset) {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    start.setDate(start.getDate() - start.getDay()); // Sunday start
    start.setDate(start.getDate() + offset * 7);
    const y = start.getFullYear();
    const m = String(start.getMonth() + 1).padStart(2, "0");
    const day = String(start.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function buildWeekStarts(fromOffset, n) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(weekStartISO(fromOffset + i));
    return out;
  }

  function isWeekScheduled(st, offset) {
    const weeks = (st && st.scheduledWeeks) || [];
    if (!weeks.length && st && st.plan) {
      // Migrate older saves: cover N weeks from current week
      return offset >= 0 && offset < cadenceWeeks(activePlanCadence(st));
    }
    return weeks.indexOf(weekStartISO(offset)) !== -1;
  }

  function rebuildScheduledWeeks(st) {
    const set = {};
    (st.planBlocks || []).forEach((b) => {
      (b.weeks || []).forEach((w) => { set[w] = true; });
    });
    st.scheduledWeeks = Object.keys(set).sort();
    return st.scheduledWeeks;
  }

  /** Plan assigned to a Sunday week ISO, or null. */
  function planForWeekISO(st, weekISO) {
    const blocks = (st && st.planBlocks) || [];
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (b && b.plan && b.weeks && b.weeks.indexOf(weekISO) !== -1) return b.plan;
    }
    // Legacy single-plan fallback
    if (st && st.plan && (st.scheduledWeeks || []).indexOf(weekISO) !== -1) return st.plan;
    return null;
  }

  function planForOffset(st, offset) {
    return planForWeekISO(st, weekStartISO(offset));
  }

  /**
   * Assign plan to weekStarts. Removes those weeks from other blocks (so a week
   * has at most one plan). Does not delete unrelated earlier/later blocks.
   */
  function upsertPlanBlock(st, weekStarts, plan, profile) {
    if (!st.planBlocks) st.planBlocks = [];
    // Never mutate planBlocks for weeks whose groceries are already ordered.
    const covered = {};
    (st.groceryCoveredWeeks || []).forEach((w) => { covered[w] = true; });
    weekStarts = (weekStarts || []).filter((w) => !covered[w]);
    const take = {};
    weekStarts.forEach((w) => { take[w] = true; });
    st.planBlocks = st.planBlocks
      .map((b) => {
        const nb = { weeks: (b.weeks || []).filter((w) => !take[w]), plan: b.plan };
        if (b.profile) nb.profile = b.profile; // keep each block's own settings snapshot
        if (b.scheduledAt) nb.scheduledAt = b.scheduledAt;
        return nb;
      })
      .filter((b) => b.weeks && b.weeks.length && b.plan);
    const weeks = (weekStarts || []).slice().sort();
    if (weeks.length && plan) {
      const snap = pickProfile(profile) || profileFromPlan(plan, st.answers);
      st.planBlocks.push({ weeks: weeks, plan: plan, profile: snap, scheduledAt: new Date().toISOString() });
    }
    rebuildScheduledWeeks(st);
    return st;
  }

  /** Copy an existing plan onto additional weeks (Repeat previous). */
  function extendPlanToWeeks(st, weekStarts, plan, profile) {
    return upsertPlanBlock(st, weekStarts, plan || st.plan, profile);
  }

  function ensureScheduledWeeks(st) {
    if (!st.planBlocks) st.planBlocks = [];
    // Migrate older saves: one global plan + scheduledWeeks → planBlocks
    if (st.plan && (!st.planBlocks || !st.planBlocks.length)) {
      if (st.scheduledWeeks && st.scheduledWeeks.length) {
        st.planBlocks = [{ weeks: st.scheduledWeeks.slice().sort(), plan: st.plan }];
      } else {
        const n = cadenceWeeks(st.answers && st.answers.cadence);
        st.planBlocks = [{ weeks: buildWeekStarts(0, n), plan: st.plan }];
      }
    }
    rebuildScheduledWeeks(st);
    // Older saves: groceries confirmed ⇒ those scheduled weeks were covered
    if (st.groceriesConfirmed && st.scheduledWeeks && st.scheduledWeeks.length &&
        (!st.groceryCoveredWeeks || !st.groceryCoveredWeeks.length)) {
      st.groceryCoveredWeeks = st.scheduledWeeks.slice();
    }
    if (!st.groceryCoveredWeeks) st.groceryCoveredWeeks = [];
    // Profile migration: snapshot settings into blocks that predate per-block
    // snapshots (before any profile edit), and mark onboarding as done.
    let migrated = false;
    (st.planBlocks || []).forEach((b) => {
      if (b && b.plan && !b.profile) {
        b.profile = profileFromPlan(b.plan, st.answers);
        migrated = true;
      }
    });
    if (hasCompletedProfile(st) && !st.profileCompleted) {
      st.profileCompleted = true;
      migrated = true;
    }
    if (st.answers) {
      const clean = pickProfile(st.answers);
      if (JSON.stringify(clean) !== JSON.stringify(st.answers)) {
        st.answers = clean; // drop transient questionnaire fields (_inventory, reroll history…)
        migrated = true;
      }
    }
    if (migrated) saveState(st);
    return st;
  }

  /** True when inventory qty covers one full plan week of daily ingredient needs. */
  function inventoryCoversPlanWeek(st, planOpt) {
    const plan = planOpt || st.plan;
    if (!st.groceriesConfirmed || !st.inventory || !st.inventory.length || !plan) return false;
    // Use the week's own plan days (snapshot), not the live profile.
    const selected = (plan.selectedDays && plan.selectedDays.length ? plan.selectedDays : null) ||
      (st.answers && st.answers.selectedDays) || [];
    const days = selected.length || plan.daysPerWeek || 6;
    const dailyNeed = M.dailyGroceryNeeds(plan.schedule); // canonical grocery keys (eggs = egg + hard boiled)
    const byKey = {};
    st.inventory.forEach((it) => { byKey[it.key] = it.qtyRemaining; });
    for (const key of Object.keys(dailyNeed)) {
      const need = dailyNeed[key] * days;
      if (!need) continue;
      if ((byKey[key] || 0) + 1e-9 < need) return false;
    }
    return Object.keys(dailyNeed).length > 0;
  }


  /** True when this week's Sunday is in groceryCoveredWeeks (groceries already ordered). */
  function isGroceryOrderedForWeek(st, offset) {
    const ws = weekStartISO(offset);
    return (st.groceryCoveredWeeks || []).indexOf(ws) !== -1;
  }

  const STOCK_OK_NOTE = "Groceries in stock";
  function stockOkHtml() {
    return `<p class="stock-ok" id="stockOk"><span class="stock-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>${STOCK_OK_NOTE}</p>`;
  }

  function inventoryNoteForWeek(st, offset) {
    const weekPlan = planForOffset(st, offset);
    if (!weekPlan || !isWeekScheduled(st, offset)) return "";
    const ws = weekStartISO(offset);
    const covered = (st.groceryCoveredWeeks || []).indexOf(ws) !== -1;
    if (!st.groceriesConfirmed || !covered) {
      // First-save nextOrderDate is the plan-start Sunday — order BEFORE that day.
      const next = st.nextOrderDate
        ? (st.groceriesConfirmed
            ? " Groceries will be ordered on " + formatNice(st.nextOrderDate) + "."
            : " Order groceries before " + formatNice(st.nextOrderDate) + " (plan start).")
        : " Groceries have not been ordered yet.";
      return "Inventory does not have the groceries required for this week." + next;
    }
    if (inventoryCoversPlanWeek(st, weekPlan)) {
      return STOCK_OK_NOTE;
    }
    return "Inventory does not have all the groceries required for this week.";
  }

  function addDays(iso, n) {
    const d = new Date(iso + "T12:00:00");
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function formatNice(iso) {
    if (!iso) return "—";
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  }

  function isPlanWeekday(selectedDays, dateObj) {
    if (!selectedDays || !selectedDays.length) return true;
    const id = DAY_IDS[dateObj.getDay()];
    return selectedDays.indexOf(id) !== -1;
  }

  /** Deplete inventory for each elapsed plan day since lastDepletedDate / lastOrderedAt. */
  function depleteInventory(state) {
    if (!state.groceriesConfirmed || !state.inventory || !state.inventory.length) return state;
    if (!state.plan && !(state.planBlocks && state.planBlocks.length)) return state;
    const start = state.lastDepletedDate || state.lastOrderedAt;
    if (!start) return state;
    const today = todayISO();
    let cursor = addDays(start, 1); // deplete for days after last marked
    const planStart = earliestScheduledWeek(state);
    let changed = false;
    while (cursor <= today) {
      if (cursor < planStart) {
        cursor = addDays(cursor, 1);
        continue;
      }
      // Sunday of the week containing cursor
      const d = new Date(cursor + "T12:00:00");
      const sun = new Date(d);
      sun.setDate(d.getDate() - d.getDay());
      const y = sun.getFullYear();
      const mo = String(sun.getMonth() + 1).padStart(2, "0");
      const da = String(sun.getDate()).padStart(2, "0");
      const weekISO = y + "-" + mo + "-" + da;
      const weekPlan = planForWeekISO(state, weekISO);
      if (!weekPlan) {
        cursor = addDays(cursor, 1);
        continue;
      }
      const weekProfile = profileForWeekISO(state, weekISO);
      const selected = (weekPlan.selectedDays && weekPlan.selectedDays.length ? weekPlan.selectedDays : null) ||
        (weekProfile && weekProfile.selectedDays) || [];
      if (isPlanWeekday(selected, d)) {
        const dailyNeed = M.dailyGroceryNeeds(weekPlan.schedule);
        state.inventory = state.inventory.map((item) => {
          const need = dailyNeed[item.key] || 0;
          if (need <= 0) return item;
          changed = true;
          const left = Math.max(0, Math.round((item.qtyRemaining - need) * 100) / 100);
          return Object.assign({}, item, { qtyRemaining: left });
        });
      }
      cursor = addDays(cursor, 1);
    }
    state.lastDepletedDate = today;
    if (changed) saveState(state);
    return state;
  }

  /** { canonicalKey: qty } from saved/draft In stock rows. */
  function stockMapFrom(rows) {
    const map = {};
    (rows || []).forEach((r) => {
      const q = Number(r && r.qty) || 0;
      if (!r || !r.key || q <= 0) return;
      const k = M.groceryKey(r.key);
      map[k] = Math.round(((map[k] || 0) + M.groceryQty(r.key, q)) * 1000) / 1000;
    });
    return map;
  }

  /** Suggested list for the next order, reduced by In stock amounts (rows default to saved state.inStock). */
  function suggestedGrocery(st, stockRows) {
    const base = (st.plan && st.plan.grocery) || st.groceryList;
    if (!base) return null;
    return M.applyStockToGrocery(base, stockMapFrom(stockRows || st.inStock));
  }

  function confirmGroceries(state) {
    const base = (state.plan && state.plan.grocery) || state.groceryList;
    if (!base) return state;
    // Order = suggested list minus saved In stock amounts (one line per product).
    const stock = stockMapFrom(state.inStock);
    const list = M.applyStockToGrocery(base, stock);
    const now = todayISO();
    // Merge newly ordered qty onto leftover inventory (grocery list already subtracted on-hand),
    // plus what the user said they already had (In stock) — each counted exactly once.
    const byKey = {};
    M.canonicalizeInventory(state.inventory || []).forEach((it) => {
      byKey[it.key] = Object.assign({}, it);
    });
    Object.keys(stock).forEach((k) => {
      const prevQty = byKey[k] ? Number(byKey[k].qtyRemaining) || 0 : 0;
      const newQty = Math.round((prevQty + stock[k]) * 100) / 100;
      const line = M.groceryLine(k, stock[k]);
      byKey[k] = {
        key: k,
        name: (byKey[k] && byKey[k].name) || line.name,
        unit: line.unit,
        qtyRemaining: newQty,
        qtyLabel: M.formatQty(newQty) + " " + line.unit,
        initialQty: newQty,
      };
    });
    (list.items || []).forEach((it) => {
      const prevQty = byKey[it.key] ? Number(byKey[it.key].qtyRemaining) || 0 : 0;
      const added = Number(it.qty) || 0;
      const newQty = Math.round((prevQty + added) * 100) / 100;
      byKey[it.key] = {
        key: it.key,
        name: it.name,
        unit: it.unit,
        qtyRemaining: newQty,
        qtyLabel: it.qtyLabel,
        initialQty: newQty,
      };
    });
    state.inventory = Object.keys(byKey).map((k) => byKey[k]);
    state.groceryList = Object.assign({}, list, {
      inStockApplied: (state.inStock || []).map((r) => Object.assign({}, r)),
    });
    // In stock amounts are now part of inventory; clear them so they don't carry into the next order.
    state.inStock = [];
    state.inStockUpdatedAt = null;
    state.lastOrderedAt = now;
    state.groceriesConfirmed = true;
    // Cover only the weeks belonging to the plan being ordered (active block), union prior coverage.
    let activeWeeks = [];
    (state.planBlocks || []).forEach((b) => {
      if (b && b.plan === state.plan) activeWeeks = (b.weeks || []).slice();
    });
    if (!activeWeeks.length) {
      // Fallback: find block whose plan grocery matches, else cadence window from earliest.
      (state.planBlocks || []).forEach((b) => {
        if (b && b.plan && state.plan && b.plan.grocery === state.plan.grocery) {
          activeWeeks = (b.weeks || []).slice();
        }
      });
    }
    if (!activeWeeks.length) {
      activeWeeks = (state.scheduledWeeks && state.scheduledWeeks.length)
        ? state.scheduledWeeks.slice()
        : buildWeekStarts(soonestSundayWeekOffset(), cadenceWeeks(activePlanCadence(state)));
    }
    const coveredSet = {};
    (state.groceryCoveredWeeks || []).forEach((w) => { coveredSet[w] = true; });
    activeWeeks.forEach((w) => { coveredSet[w] = true; });
    state.groceryCoveredWeeks = Object.keys(coveredSet).sort();
    const planStart = activeWeeks.slice().sort()[0] || earliestScheduledWeek(state);
    // Drive: if groceries are ordered before the plan week starts, do not deplete until then.
    if (planStart > now) {
      state.lastDepletedDate = addDays(planStart, -1);
    } else {
      state.lastDepletedDate = now;
    }
    // Cadence of the plan being ordered (its snapshot), not the live profile.
    const orderedProfile = profileForWeekISO(state, planStart);
    const span = cadenceDays((orderedProfile && orderedProfile.cadence) || activePlanCadence(state));
    state.nextOrderDate = addDays(planStart, span);
    saveState(state);
    return state;
  }

  function pieStyle(macros) {
    const p = Number(macros.p) || 0;
    const c = Number(macros.c) || 0;
    const f = Number(macros.f) || 0;
    const pEnd = p;
    const cEnd = p + c;
    // hollow ring via mask-like layered gradients: use conic on outer, hole overlays
    return (
      "background: conic-gradient(" +
      "#5a7a52 0 " + pEnd + "%, " +
      "#c4785a " + pEnd + "% " + cEnd + "%, " +
      "#b8a06a " + cEnd + "% 100%)"
    );
  }

  let state = ensureScheduledWeeks(depleteInventory(loadState()));
  let screen = "home";
  let calCursor = new Date();
  calCursor.setDate(1);
  let weekOffset = 0;

  const els = {
    home: document.getElementById("screen-home"),
    inventory: document.getElementById("screen-inventory"),
    schedule: document.getElementById("screen-schedule"),
    profile: document.getElementById("screen-profile"),
    onboard: document.getElementById("screen-onboard"),
    onboardRoot: document.getElementById("onboard-root"),
  };

  function setScreen(name, opts) {
    // Leaving Profile with unsaved edits: confirm, and discard the draft if they leave.
    if (screen === "profile" && name !== "profile" && profileDirty()) {
      const leave = window.confirm("You have unsaved profile changes. Leave without saving? Your changes will be discarded.");
      if (!leave) return false;
    }
    if (name !== "profile") profileDraft = null;
    // Leaving Inventory with unsaved In stock edits: same pattern as Profile.
    if (screen === "inventory" && name !== "inventory" && inStockDirty()) {
      const leave = window.confirm("You have unsaved In stock changes. Leave without saving? Your changes will be discarded.");
      if (!leave) return false;
    }
    if (name !== "inventory") { inStockDraft = null; groceryEditMode = false; }
    // Onboarding questionnaire runs once. Returning users edit answers on Profile.
    if (name === "onboard" && hasCompletedProfile(state) && !(opts && opts.startAt === "results")) {
      name = "home";
    }
    // First-time users: Profile starts the (unchanged) onboarding questionnaire.
    if (name === "profile" && !hasCompletedProfile(state)) {
      state._pendingScheduleFromOffset = null;
      name = "onboard";
      opts = {};
    }
    screen = name;
    ["home", "inventory", "schedule", "profile", "onboard"].forEach((k) => {
      els[k].classList.toggle("screen-hidden", k !== name);
    });
    const navName = name === "onboard" ? "profile" : name;
    document.querySelectorAll(".nav-btn").forEach((b) => {
      b.classList.toggle("active", b.getAttribute("data-screen") === navName);
    });
    if (name === "home") renderHome();
    if (name === "inventory") renderInventory();
    if (name === "schedule") renderSchedule();
    if (name === "profile") renderProfile();
    if (name === "onboard") startOnboarding(opts || {});
    return true;
  }


  function startOfWeek(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - x.getDay()); // Sunday start
    return x;
  }
  function weekRangeLabel(offset) {
    const start = startOfWeek(new Date());
    start.setDate(start.getDate() + offset * 7);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    const fmt = (dt) => dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const year = end.getFullYear() !== start.getFullYear() ? ", " + end.getFullYear() : "";
    return fmt(start) + " – " + fmt(end) + year;
  }

  function renderHome() {
    const root = els.home;
    const g = greeting();
    const minOff = minWeekOffset(state);
    if (weekOffset < minOff) weekOffset = minOff;
    let weekHtml = "";
    if (!state.plan) {
      weekHtml = `
        <p class="panel-muted">No meal plan yet. Fill out the onboarding questionnaire to grow your week of simple meals.</p>
        <button type="button" class="cta" id="startOnboard">Start questionnaire</button>`;
    } else {
      const weekScheduled = isWeekScheduled(state, weekOffset);
      const p = (weekScheduled && planForOffset(state, weekOffset)) || state.plan;
      const daysLabel = (p.selectedDays || [])
        .map((id) => {
          const d = M.DAYS_OF_WEEK.find((x) => x.id === id);
          return d ? d.short : id;
        })
        .join(", ");
      let mealsBody = "";
      if (weekScheduled && p) {
        mealsBody = (p.schedule || [])
          .map((slot) => {
            const s = slot.suggestion;
            const lis = (s.ingredients || [])
              .map((ing) => {
                return `<li><span class="ing-name">${ing.label}</span><span class="ing-macros">${ing.kcal} kcal · ${Math.round(ing.p)}p / ${Math.round(ing.c)}c / ${Math.round(ing.f)}f</span></li>`;
              })
              .join("");
            return `<details class="meal-row">
              <summary><span>${slot.name}: ${s.title}</span><span class="cal-chip">${s.totals.kcal} cal</span></summary>
              <div class="detail">
                <ul class="mp-ingredients">${lis}
                  <li class="totals"><span class="ing-name">Meal total</span><span class="ing-macros">${s.totals.kcal} kcal · ${s.totals.p}p / ${s.totals.c}c / ${s.totals.f}f</span></li>
                </ul>
              </div>
            </details>`;
          })
          .join("");
      } else {
        mealsBody = `
          <p class="panel-muted">Nothing scheduled for this week.</p>
          <button type="button" class="cta" id="repeatMealPlan">Repeat previous meal plan</button>
          <button type="button" class="cta secondary" id="pickNewMeals" style="margin-left:8px">Pick new meals</button>
          <p class="panel-muted" style="margin-top:8px">Either option schedules meals without ordering groceries yet — groceries wait until the next grocery order date.</p>`;
      }
      const invNote = weekScheduled ? inventoryNoteForWeek(state, weekOffset) : "";
      weekHtml = `
        <div class="macro-pie-wrap">
          <div class="macro-pie" style="${pieStyle(p.daily.macros)}">
            <div class="macro-pie-hole"><strong>${p.daily.calories}</strong><span>cals</span></div>
          </div>
          <div class="macro-legend">
            <div><i style="background:#5a7a52"></i>Protein ${p.daily.macros.p}% · ${p.daily.protein_g}g</div>
            <div><i style="background:#c4785a"></i>Carbs ${p.daily.macros.c}% · ${p.daily.carbs_g}g</div>
            <div><i style="background:#b8a06a"></i>Fat ${p.daily.macros.f}% · ${p.daily.fat_g}g</div>
            <div style="margin-top:6px"><span class="pill">${p.daysPerWeek} days/week</span> ${daysLabel ? "· " + daysLabel : ""}</div>
          </div>
        </div>
        <div class="week-toggle" style="display:flex;align-items:center;gap:8px;margin-top:12px">
          <button type="button" class="cta secondary" id="prevWeek" aria-label="Previous week"${weekOffset <= minOff ? " disabled" : ""}>←</button>
          <strong style="flex:1;text-align:center">${weekRangeLabel(weekOffset)}</strong>
          <button type="button" class="cta secondary" id="nextWeek" aria-label="Next week">→</button>
        </div>
        <div style="margin-top:12px">${mealsBody}</div>
        ${invNote === STOCK_OK_NOTE ? stockOkHtml() : (invNote ? `<p class="panel-muted" style="margin-top:8px">${invNote}</p>` : "")}`;
    }

    let invPanel = "";
    if (!state.plan) {
      invPanel = `<p class="panel-muted">Inventory is empty until you complete onboarding.</p>`;
    } else if (!state.groceriesConfirmed) {
      invPanel = `
        <p class="panel-muted">Order the groceries for your <strong>${({ weekly: "weekly", every_other_week: "every other week", monthly: "monthly" })[activePlanCadence(state)] || "weekly"}</strong> shopping window, then confirm below.</p>
        <button type="button" class="cta" id="confirmGroceries">Confirm groceries ordered</button>
        <button type="button" class="cta secondary" id="viewInv" style="margin-left:8px">View list</button>`;
    } else {
      const left = (state.inventory || []).filter((i) => i.qtyRemaining > 0).length;
      invPanel = `<p class="panel-muted">${left} items still in stock. <button type="button" class="cta secondary" id="goInv">Open inventory</button></p>`;
    }

    const schedPanel = state.nextOrderDate
      ? (state.groceriesConfirmed
          ? `<p class="panel-muted">Next grocery order: <strong>${formatNice(state.nextOrderDate)}</strong></p>`
          : `<p class="panel-muted">Order groceries before <strong>${formatNice(state.nextOrderDate)}</strong> (plan start).</p>`)
      : `<p class="panel-muted">No order scheduled yet.${state.plan ? " Confirm groceries to set a date." : ""}</p>`;

    const updateLocked = !!(state.plan && isWeekScheduled(state, weekOffset) && isGroceryOrderedForWeek(state, weekOffset));
    root.innerHTML = `
      <p class="welcome">${g} 🌿</p>
      <section class="panel"><h2>Week at a glance</h2>${weekHtml}</section>
      <section class="panel"><h2>Inventory</h2>${invPanel}</section>
      <section class="panel"><h2>Schedule</h2>${schedPanel}
        <button type="button" class="cta secondary" id="goSched">Open calendar</button>
        <button type="button" class="cta secondary" id="updateMealPlan" style="margin-left:8px" ${state.plan && !updateLocked ? "" : "disabled"}>Update meal plan</button>
        ${updateLocked ? `<p class="panel-muted" style="margin-top:8px">Meal plan updates are disabled for this week — groceries are already ordered.</p>` : ""}
      </section>`;

    const start = root.querySelector("#startOnboard");
    if (start) start.onclick = () => {
      state._pendingScheduleFromOffset = null;
      setScreen("onboard");
    };
    const conf = root.querySelector("#confirmGroceries");
    if (conf) conf.onclick = () => { state = confirmGroceries(state); renderHome(); };
    const goInv = root.querySelector("#goInv") || root.querySelector("#viewInv");
    if (goInv) goInv.onclick = () => setScreen("inventory");
    const goSched = root.querySelector("#goSched");
    if (goSched) goSched.onclick = () => setScreen("schedule");
    const updateMeal = root.querySelector("#updateMealPlan");
    if (updateMeal) {
      updateMeal.onclick = () => {
        if (!state.plan || !state.answers) return;
        // Covered weeks (groceries already ordered) cannot be updated.
        if (isGroceryOrderedForWeek(state, weekOffset)) return;
        // Schedule the update window from the week being viewed.
        state._pendingScheduleFromOffset = weekOffset;
        saveState(state);
        const viewedISO = weekStartISO(weekOffset);
        const weekPlan = isWeekScheduled(state, weekOffset) ? planForWeekISO(state, viewedISO) : null;
        let answersForUpdate;
        let planForUpdate;
        if (weekPlan) {
          // Already-scheduled week: rerolls keep that week's own goals/settings snapshot.
          answersForUpdate = profileForWeekISO(state, viewedISO) || profileFromPlan(weekPlan, state.answers);
          planForUpdate = weekPlan;
        } else {
          // Unscheduled week: this is a new plan, so it follows the current profile.
          answersForUpdate = pickProfile(state.answers);
          planForUpdate = planMatchesProfile(state.plan, state.answers) ? state.plan : null;
        }
        setScreen("onboard", {
          startAt: "results",
          answers: answersForUpdate,
          plan: planForUpdate,
          inventory: state.inventory || [],
          mealPlanLocked: false,
        });
      };
    }
    const prevWeek = root.querySelector("#prevWeek");
    if (prevWeek) {
      prevWeek.onclick = () => {
        const floor = minWeekOffset(state);
        if (weekOffset <= floor) return;
        weekOffset -= 1;
        renderHome();
      };
    }
    const nextWeek = root.querySelector("#nextWeek");
    if (nextWeek) nextWeek.onclick = () => { weekOffset += 1; renderHome(); };
    const repeatPlan = root.querySelector("#repeatMealPlan");
    if (repeatPlan) {
      repeatPlan.onclick = () => {
        // New weeks follow the current profile (cadence, targets, budget…).
        const profile = pickProfile(state.answers);
        const n = cadenceWeeks(profile && profile.cadence);
        const add = buildWeekStarts(weekOffset, n);
        // Copy the most recent prior plan onto the new cadence window without dropping old blocks.
        let priorPlan = state.plan;
        const priorWeeks = (state.scheduledWeeks || []).filter((w) => w < weekStartISO(weekOffset)).sort();
        if (priorWeeks.length) {
          priorPlan = planForWeekISO(state, priorWeeks[priorWeeks.length - 1]) || state.plan;
        }
        let planToSchedule = priorPlan;
        if (profile && priorPlan && !planMatchesProfile(priorPlan, profile)) {
          // Profile changed since that plan was made: rebuild with the same meal
          // variant so the repeat keeps its flavor but meets the updated goals.
          planToSchedule = M.buildPlan(Object.assign({}, profile), { variant: priorPlan.variant || 0 });
        }
        extendPlanToWeeks(state, add, planToSchedule, profile);
        // Doc: Repeat does not order groceries; keep nextOrderDate & groceryCoveredWeeks unchanged.
        saveState(state);
        renderHome();
      };
    }
    const pickNew = root.querySelector("#pickNewMeals");
    if (pickNew) {
      pickNew.onclick = () => {
        if (!state.plan || !state.answers) return;
        state._pendingScheduleFromOffset = weekOffset;
        saveState(state);
        // New weeks follow the current profile; only reuse the latest plan as a
        // starting point when it was generated with these same settings.
        setScreen("onboard", {
          startAt: "results",
          answers: pickProfile(state.answers),
          plan: planMatchesProfile(state.plan, state.answers) ? state.plan : null,
          inventory: state.inventory || [],
        });
      };
    }
  }

  /** Friendly short date, e.g. "Sat, Oct 3" (adds the year when it isn't this year). */
  function formatShortDate(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T12:00:00");
    const o = { weekday: "short", month: "short", day: "numeric" };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
    return d.toLocaleDateString(undefined, o);
  }

  function orderDatesHtml(st) {
    const last = st.groceriesConfirmed && st.lastOrderedAt ? formatShortDate(st.lastOrderedAt) : "None yet";
    const next = st.nextOrderDate ? formatShortDate(st.nextOrderDate) : "Not scheduled";
    return `<div class="order-dates">
        <div class="order-date" id="lastOrderDate"><span>Last grocery order</span><strong>${last}</strong></div>
        <div class="order-date next" id="nextOrderDate"><span>Next grocery order</span><strong>${next}</strong></div>
      </div>`;
  }

  function renderInventory() {
    const root = els.inventory;
    if (!state.plan) {
      root.innerHTML = `<section class="panel"><h2>Inventory</h2><p class="panel-muted">Complete the questionnaire first.</p>
        <button type="button" class="cta" id="toOn">Start questionnaire</button></section>`;
      root.querySelector("#toOn").onclick = () => setScreen("onboard");
      return;
    }
    if (!state.groceriesConfirmed) {
      renderSuggestedGroceries(root);
      return;
    }
    const rows = (state.inventory || []).map((it) => {
      return `<div class="inv-item"><span>${it.name}<br/><small class="panel-muted">${it.qtyRemaining} ${it.unit} left</small></span></div>`;
    }).join("");
    root.innerHTML = `<section class="panel"><h2>Your inventory</h2>
      ${orderDatesHtml(state)}
      <p class="panel-muted">Your inventory automatically depletes as your plan days elapse.</p>
      ${rows || "<p class='panel-muted'>Empty.</p>"}
      <button type="button" class="cta secondary" id="reconfirm" style="margin-top:10px">Re-order / reset from grocery list</button>
    </section>`;
    root.querySelector("#reconfirm").onclick = () => { state = confirmGroceries(state); renderInventory(); };
  }

  /* ── Suggested groceries + In stock (doc26) ──
   * inStockDraft is in-memory only; nothing persists until Save (Profile pattern).
   * Confirming the order applies what's on screen. */
  let inStockDraft = null;   // [{ key, name, unit, qty }] or null when untouched
  let groceryEditMode = false;
  const INSTOCK_SAVED_MSG = "Your In stock items are saved and the suggested grocery list has been trimmed to match.";

  function cleanStockRows(rows) {
    const map = stockMapFrom(rows);
    return Object.keys(map).sort().map((k) => {
      const line = M.groceryLine(k, map[k]);
      const prev = (rows || []).find((r) => r && M.groceryKey(r.key) === k);
      return { key: k, name: (prev && prev.name) || line.name, unit: line.unit, qty: map[k] };
    });
  }
  function stockRowsKey(rows) {
    return JSON.stringify(cleanStockRows(rows).map((r) => [r.key, r.qty]));
  }
  function currentStockRows() {
    return inStockDraft || state.inStock || [];
  }
  function inStockDirty() {
    if (!inStockDraft) return false;
    return stockRowsKey(inStockDraft) !== stockRowsKey(state.inStock || []);
  }
  function setDraftStock(key, qty, name, unit) {
    const rows = cleanStockRows(currentStockRows()).filter((r) => r.key !== key);
    const q = Math.round((Number(qty) || 0) * 1000) / 1000;
    if (q > 0) rows.push({ key, name, unit, qty: q });
    inStockDraft = cleanStockRows(rows);
  }
  function money(n) { return "$" + (Number(n) || 0).toFixed(2); }
  function qtyText(q, unit) { return M.formatQty(Number(q) || 0) + " " + M.displayUnit(unit, q); }

  function inStockListHtml(rows) {
    if (!rows.length) {
      return `<p class="panel-muted" id="inStockEmpty">Nothing yet. Enter the amount you have next to any grocery below and it will show up here.</p>`;
    }
    return `<ul class="in-stock-list" id="inStockList">${rows.map((r) => `
      <li class="in-stock-item" data-key="${escHtml(r.key)}">
        <span class="is-name">${escHtml(r.name)}</span>
        <span class="is-amt">${escHtml(qtyText(r.qty, r.unit))}</span>
        <button type="button" class="in-stock-x" data-key="${escHtml(r.key)}" aria-label="Remove ${escHtml(r.name)} from In stock" title="Remove">✕</button>
      </li>`).join("")}</ul>`;
  }

  function renderSuggestedGroceries(root) {
    const base = M.normalizeGroceryList((state.plan && state.plan.grocery) || state.groceryList);
    const baseItems = (base && base.items) || [];
    const rowsHtml = baseItems.map((it) => {
      const step = M.groceryUnitStep(it.key);
      return `<div class="inv-item grocery-row" data-key="${escHtml(it.key)}">
        <span class="gr-main">${escHtml(it.name)}<br/><small class="panel-muted gr-qty">buy ${escHtml(it.qtyLabel)}</small></span>
        <span class="gr-price">${money(it.lineTotal)}</span>
        <label class="gr-have" ${groceryEditMode ? "" : "hidden"}>
          <span>I have</span>
          <input type="number" class="gr-have-input" data-key="${escHtml(it.key)}" data-name="${escHtml(it.name)}" data-unit="${escHtml(it.unit)}"
            min="0" step="${step}" inputmode="decimal" placeholder="0" aria-label="Amount of ${escHtml(it.name)} you already have (${escHtml(it.unit)})" />
          <span class="gr-unit">${escHtml(M.displayUnit(it.unit, 2))}</span>
        </label>
      </div>`;
    }).join("");
    root.innerHTML = `
      <section class="panel in-stock-panel" id="inStockPanel" hidden>
        <h2><span class="leaf" aria-hidden="true">🌿</span>In stock</h2>
        <p class="panel-muted" style="margin:0">Already in your kitchen — these amounts are taken off the suggested list below.</p>
        <div id="inStockBody"></div>
      </section>
      <section class="panel"><h2>Suggested groceries</h2>
        ${orderDatesHtml(state)}
        <p class="panel-muted">Confirm once you've ordered these for your shopping window.</p>
        <div id="groceryRows">${rowsHtml}</div>
        <p class="panel-muted" id="groceryAllCovered" hidden>Everything on this list is already in stock. 🌱</p>
        ${baseItems.length ? "" : "<p class='panel-muted'>No items.</p>"}
        <p class="panel-muted grocery-covered-note" id="groceryCoveredNote" hidden></p>
        ${baseItems.length ? `<div class="grocery-total" id="groceryTotalRow"><span>Estimated total</span><strong id="groceryTotal">${money(base.grandTotal)}</strong></div>
        <p class="mp-price-note">Prices are estimates; the price on Walmart.com governs.</p>` : ""}
        <div class="grocery-actions">
          <button type="button" class="cta" id="confirmGroceries2">Confirm groceries ordered</button>
          ${baseItems.length ? `<button type="button" class="cta secondary${groceryEditMode ? " active" : ""}" id="haveSomeBtn" aria-pressed="${groceryEditMode}">${groceryEditMode ? "Done adding what I have" : "I already have some of these items"}</button>` : ""}
        </div>
      </section>
      <div class="profile-actions inv-save-actions">
        <button type="button" class="cta" id="saveInStock">Save</button>
        <span class="profile-dirty" id="inStockDirtyNote" hidden>Unsaved changes</span>
      </div>`;

    refreshGroceryViews(root);

    root.querySelector("#confirmGroceries2").onclick = () => {
      // Confirming the order uses the (reduced) list on screen, so apply any draft first.
      if (inStockDraft) { state.inStock = cleanStockRows(inStockDraft); state.inStockUpdatedAt = new Date().toISOString(); }
      inStockDraft = null;
      groceryEditMode = false;
      state = confirmGroceries(state);
      renderInventory();
    };
    const haveBtn = root.querySelector("#haveSomeBtn");
    if (haveBtn) haveBtn.onclick = () => {
      groceryEditMode = !groceryEditMode;
      renderSuggestedGroceries(root);
      if (groceryEditMode) {
        const first = root.querySelector(".grocery-row:not([hidden]) .gr-have-input");
        if (first) try { first.focus({ preventScroll: true }); } catch (_) {}
      }
    };
    root.querySelector("#saveInStock").onclick = saveInStockDraft;

    // Live updates: debounce while typing, apply immediately on change/blur.
    const timers = {};
    const apply = (inp) => {
      clearTimeout(timers[inp.dataset.key]);
      const raw = String(inp.value).trim();
      let v = raw === "" ? 0 : Number(raw);
      if (!isFinite(v) || v < 0) v = 0;
      const cur = stockMapFrom(currentStockRows())[inp.dataset.key] || 0;
      if (Math.abs(cur - v) < 1e-9) return;
      setDraftStock(inp.dataset.key, v, inp.dataset.name, inp.dataset.unit);
      refreshGroceryViews(root);
    };
    root.querySelectorAll(".gr-have-input").forEach((inp) => {
      inp.addEventListener("input", () => {
        clearTimeout(timers[inp.dataset.key]);
        timers[inp.dataset.key] = setTimeout(() => apply(inp), 450);
      });
      inp.addEventListener("change", () => apply(inp));
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); apply(inp); } });
    });
    root.querySelector("#inStockPanel").addEventListener("click", (e) => {
      const x = e.target.closest(".in-stock-x");
      if (!x) return;
      setDraftStock(x.dataset.key, 0);
      refreshGroceryViews(root);
    });
  }

  /** Update In stock, rows, total and dirty note in place (keeps focus in the input being typed in). */
  function refreshGroceryViews(root) {
    const rows = cleanStockRows(currentStockRows());
    const adjusted = suggestedGrocery(state, rows);
    const panel = root.querySelector("#inStockPanel");
    if (panel) {
      panel.hidden = !(rows.length || groceryEditMode);
      root.querySelector("#inStockBody").innerHTML = inStockListHtml(rows);
    }
    const byKey = {};
    ((adjusted && adjusted.items) || []).forEach((it) => { byKey[it.key] = it; });
    const stock = stockMapFrom(rows);
    let visible = 0;
    root.querySelectorAll(".grocery-row").forEach((row) => {
      const key = row.dataset.key;
      const it = byKey[key];
      row.hidden = !it;
      if (!it) return;
      visible += 1;
      const reduced = it.originalQty != null && it.stockQty > 0;
      row.classList.toggle("reduced", !!reduced);
      row.querySelector(".gr-qty").innerHTML = reduced
        ? `buy ${escHtml(it.qtyLabel)} <span class="gr-was">${escHtml(qtyText(it.originalQty, it.unit))}</span>`
        : `buy ${escHtml(it.qtyLabel)}`;
      row.querySelector(".gr-price").textContent = money(it.lineTotal);
      const inp = row.querySelector(".gr-have-input");
      if (inp && document.activeElement !== inp) inp.value = stock[key] ? String(stock[key]) : "";
    });
    const total = root.querySelector("#groceryTotal");
    if (total && adjusted) total.textContent = money(adjusted.grandTotal);
    const covered = (adjusted && adjusted.coveredByStock) || [];
    const note = root.querySelector("#groceryCoveredNote");
    if (note) {
      note.hidden = !covered.length;
      note.textContent = covered.length
        ? covered.length + (covered.length === 1 ? " item is" : " items are") + " fully covered by what's in stock."
        : "";
    }
    const allCovered = root.querySelector("#groceryAllCovered");
    if (allCovered) allCovered.hidden = !(visible === 0 && root.querySelectorAll(".grocery-row").length > 0);
    const dirty = root.querySelector("#inStockDirtyNote");
    if (dirty) dirty.hidden = !inStockDirty();
  }

  function saveInStockDraft() {
    const root = els.inventory;
    // Flush a value still being typed (debounce) before saving.
    root.querySelectorAll(".gr-have-input").forEach((inp) => inp.dispatchEvent(new Event("change")));
    if (!inStockDirty()) {
      inStockDraft = null;
      refreshGroceryViews(root);
      showNotice("No changes to save", "Your In stock list already matches what's saved.");
      return false;
    }
    state.inStock = cleanStockRows(inStockDraft);
    state.inStockUpdatedAt = new Date().toISOString();
    saveState(state);
    inStockDraft = null;
    refreshGroceryViews(root);
    showNotice("Saved 🌿", INSTOCK_SAVED_MSG);
    return true;
  }

  function renderSchedule() {
    const root = els.schedule;
    const y = calCursor.getFullYear();
    const m = calCursor.getMonth();
    const monthName = calCursor.toLocaleString(undefined, { month: "long", year: "numeric" });
    const firstDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const today = todayISO();
    const ordered = state.lastOrderedAt;
    const next = state.nextOrderDate;
    const coverageEnd = next ? addDays(next, -1) : null;
    const coverageStart = state.scheduledWeeks && state.scheduledWeeks.length
      ? state.scheduledWeeks.slice().sort()[0]
      : ordered;

    let cells = "";
    for (let i = 0; i < firstDow; i++) cells += `<div class="cal-cell muted"></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const iso = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      const cls = ["cal-cell"];
      if (iso === today) cls.push("today");
      if (iso === next) cls.push("order-day");
      else if (coverageStart && coverageEnd && iso >= coverageStart && iso <= coverageEnd) cls.push("coverage");
      cells += `<div class="${cls.join(" ")}" title="${iso}">${day}</div>`;
    }

    root.innerHTML = `
      <section class="panel">
        <h2>Schedule</h2>
        <p class="panel-muted" id="schedNextOrder">Next order: <strong>${next ? formatShortDate(next) : "Not scheduled"}</strong></p>
        <div class="cal-head">
          <button type="button" id="prevM" aria-label="Previous month">←</button>
          <strong>${monthName}</strong>
          <button type="button" id="nextM" aria-label="Next month">→</button>
        </div>
        <div class="cal-grid">
          <div class="dow">Su</div><div class="dow">Mo</div><div class="dow">Tu</div><div class="dow">We</div>
          <div class="dow">Th</div><div class="dow">Fr</div><div class="dow">Sa</div>
          ${cells}
        </div>
        <p class="panel-muted" style="margin-top:10px">Terracotta = grocery coverage · outlined = next order · sage ring = today</p>
      </section>`;
    root.querySelector("#prevM").onclick = () => { calCursor.setMonth(calCursor.getMonth() - 1); renderSchedule(); };
    root.querySelector("#nextM").onclick = () => { calCursor.setMonth(calCursor.getMonth() + 1); renderSchedule(); };
  }

  let onboardingApi = null;
  function startOnboarding(opts) {
    els.onboardRoot.innerHTML = "";
    onboardingApi = M.createOnboarding(els.onboardRoot, opts || {});
  }

  /* ── Profile screen ── */
  const PROFILE_SAVED_MSG = "Profile saved. Your changes apply to meal plans scheduled from now on. Meal plans and goals already scheduled stay the same.";
  let profileDraft = null; // in-memory only; never persisted until Save

  function profileDirty() {
    if (!profileDraft || !state.answers) return false;
    return profileKey(profileDraft) !== profileKey(state.answers);
  }

  function escHtml(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
  }

  const CADENCE_LABELS = { weekly: "Weekly", every_other_week: "Every other week", monthly: "Monthly" };
  const ACTIVITY_LABELS = {
    sedentary: "Sedentary (~12 kcal/lb)",
    light: "Lightly active (~13.5)",
    moderate: "Moderately active (~15)",
    active: "Active (~17)",
    very_active: "Very active (~19)",
  };
  const CAL_MODE_LABELS = { known: "I know my daily caloric goal", help: "Help me find out" };

  /** Same validation rules/messages as the onboarding questionnaire. */
  function validateProfile(d) {
    const budget = Number(d.budget);
    if (!budget || budget <= 0) return "Enter a monthly budget in USD.";
    if (!d.cadence || !CADENCE_LABELS[d.cadence]) return "Pick how often you order groceries.";
    if (d.calorieMode !== "known" && d.calorieMode !== "help") return "Pick how to set your daily caloric goal.";
    if (d.calorieMode === "known") {
      const cal = Number(d.calories);
      if (!cal || cal < 800) return "Enter at least 800 calories.";
      if (!d.weightGoal) return "Pick a weight goal.";
    } else {
      if (!Number(d.weightLbs) || !d.weightGoal || !d.activity) return "Fill in weight, weight goal, and activity.";
    }
    if (!d.mealOption || !M.MEAL_OPTIONS[d.mealOption]) return "Pick a meal structure.";
    if (!d.selectedDays || !d.selectedDays.length) return "Select at least one day.";
    return null;
  }

  function profileRadio(name, options, selected) {
    return `<div class="mp-options">${options.map((o) => `
      <label class="mp-option${selected === o.value ? " selected" : ""}">
        <input type="radio" name="${name}" value="${escHtml(o.value)}" ${selected === o.value ? "checked" : ""} />
        <span>${escHtml(o.label)}</span>
      </label>`).join("")}</div>`;
  }

  function derivedTargetsHtml(d) {
    const n = normalizeProfile(d);
    const macro = M.macrosFromWeightGoal(n.weightGoal);
    const cals = Number(n.calories) || 0;
    let calLine;
    if (n.calorieMode === "help") {
      calLine = (n.weightLbs && n.weightGoal && n.activity)
        ? `Estimated daily calories: <strong>${cals}</strong> (weight × activity factor; lose −500, gain +300, rounded to 50).`
        : `Fill in weight, weight goal, and activity to estimate daily calories.`;
    } else {
      calLine = cals >= 800 ? `Daily calories: <strong>${cals}</strong>` : `Enter at least 800 calories.`;
    }
    let grams = "";
    if (cals >= 800) {
      const g = M.gramsFromPct(cals, macro);
      grams = ` · about ${g.p}g protein / ${g.c}g carbs / ${g.f}g fat`;
    }
    return `${calLine}<br/>Macro targets from weight goal: <strong>${macro.p}% p / ${macro.c}% c / ${macro.f}% f</strong>${grams}`;
  }

  /** Copy current form values into the in-memory draft (no validation, no persistence). */
  function syncProfileDraftFromForm(root) {
    const d = profileDraft;
    const val = (sel) => { const n = root.querySelector(sel); return n ? n.value : undefined; };
    const radio = (name) => { const n = root.querySelector(`input[name="${name}"]:checked`); return n ? n.value : null; };
    const b = val("#pf-budget"); if (b !== undefined) d.budget = b === "" ? "" : Number(b);
    const cad = radio("pf-cadence"); if (cad) d.cadence = cad;
    const mode = radio("pf-calorieMode"); if (mode) d.calorieMode = mode;
    const cal = val("#pf-calories"); if (cal !== undefined) d.calories = cal === "" ? "" : Number(cal);
    const wg = radio("pf-weightGoal"); if (wg) d.weightGoal = wg;
    const wgSel = val("#pf-weightGoalSel"); if (wgSel !== undefined) d.weightGoal = wgSel || null;
    const wl = val("#pf-weightLbs"); if (wl !== undefined) d.weightLbs = wl === "" ? null : Number(wl);
    const act = val("#pf-activity"); if (act !== undefined) d.activity = act || null;
    const meal = radio("pf-meals");
    if (meal) {
      d.mealOption = meal;
      d.meals = M.MEAL_OPTIONS[meal].meals;
      d.snacks = M.MEAL_OPTIONS[meal].snacks;
    }
    const dayBoxes = root.querySelectorAll('input[name="pf-day"]');
    if (dayBoxes.length) {
      d.selectedDays = Array.from(dayBoxes).filter((n) => n.checked).map((n) => n.value);
      d.daysPerWeek = d.selectedDays.length;
    }
    if (d.calorieMode === "help" && d.weightLbs && d.weightGoal && d.activity) {
      d.calories = M.estimateCalories(d.weightLbs, d.weightGoal, d.activity);
    }
  }

  function renderProfile() {
    const root = els.profile;
    if (!hasCompletedProfile(state)) { setScreen("onboard"); return; }
    if (!profileDraft) profileDraft = pickProfile(state.answers);
    const d = profileDraft;
    const dayChecks = M.DAYS_OF_WEEK.map((day) => {
      const on = (d.selectedDays || []).indexOf(day.id) !== -1;
      return `<label class="mp-option${on ? " selected" : ""}">
        <input type="checkbox" name="pf-day" value="${day.id}" ${on ? "checked" : ""} />
        <span>${day.label}</span>
      </label>`;
    }).join("");
    const goalOptions = [
      { value: "lose", label: "Lose" }, { value: "maintain", label: "Maintain" }, { value: "gain", label: "Gain" },
    ];
    let calorieFields;
    if (d.calorieMode === "help") {
      calorieFields = `
        <label class="mp-label" for="pf-weightLbs">Weight (lbs)</label>
        <input class="mp-input" id="pf-weightLbs" type="number" min="50" max="800" step="0.1" value="${escHtml(d.weightLbs ?? "")}" />
        <label class="mp-label" for="pf-weightGoalSel">Weight goal</label>
        <select class="mp-input" id="pf-weightGoalSel">
          <option value="">Select…</option>
          ${goalOptions.map((o) => `<option value="${o.value}" ${d.weightGoal === o.value ? "selected" : ""}>${o.label}</option>`).join("")}
        </select>
        <label class="mp-label" for="pf-activity">Activity level</label>
        <select class="mp-input" id="pf-activity">
          <option value="">Select…</option>
          ${Object.keys(ACTIVITY_LABELS).map((k) => `<option value="${k}" ${d.activity === k ? "selected" : ""}>${ACTIVITY_LABELS[k]}</option>`).join("")}
        </select>`;
    } else {
      calorieFields = `
        <label class="mp-label" for="pf-calories">Daily caloric goal</label>
        <input class="mp-input" id="pf-calories" type="number" min="800" max="10000" step="10" value="${escHtml(d.calories ?? 2000)}" />
        <p class="mp-hint">Calories per day</p>
        <label class="mp-label">Weight goal</label>
        ${profileRadio("pf-weightGoal", goalOptions, d.weightGoal || "maintain")}`;
    }
    const savedAt = state.profileUpdatedAt
      ? `Last saved ${new Date(state.profileUpdatedAt).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}.`
      : "";
    root.innerHTML = `
      <section class="panel profile-intro">
        <img src="assets/icon-mark.png?v=leaf8" alt="" class="brand-mark" width="30" height="30" />
        <div>
          <h2 style="margin:0 0 4px">Your profile</h2>
          <p class="panel-muted">Your questionnaire answers. Edit anything below, then tap <strong>Save profile</strong> at the bottom — nothing changes until you save. Saved changes apply only to meal plans you schedule from now on. ${escHtml(savedAt)}</p>
        </div>
      </section>
      <form id="profileForm" novalidate>
        <section class="panel profile-group" data-group="groceries">
          <h2>Groceries &amp; budget</h2>
          <label class="mp-label" for="pf-budget">Monthly grocery budget (USD)</label>
          <input class="mp-input" id="pf-budget" type="number" min="1" step="1" placeholder="e.g. 400" value="${escHtml(d.budget ?? "")}" />
          <p class="mp-hint">USD per month</p>
          <label class="mp-label">How often do you prefer to order groceries?</label>
          ${profileRadio("pf-cadence", Object.keys(CADENCE_LABELS).map((k) => ({ value: k, label: CADENCE_LABELS[k] })), d.cadence)}
        </section>
        <section class="panel profile-group" data-group="calories">
          <h2>Calories &amp; goals</h2>
          <label class="mp-label">What is your daily caloric goal?</label>
          ${profileRadio("pf-calorieMode", [{ value: "known", label: CAL_MODE_LABELS.known }, { value: "help", label: CAL_MODE_LABELS.help }], d.calorieMode)}
          ${calorieFields}
          <p class="profile-derived" id="profileDerived">${derivedTargetsHtml(d)}</p>
        </section>
        <section class="panel profile-group" data-group="meals">
          <h2>Meals &amp; days</h2>
          <label class="mp-label">How many meals do you prefer per day?</label>
          ${profileRadio("pf-meals", Object.keys(M.MEAL_OPTIONS).map((k) => ({ value: k, label: M.MEAL_OPTIONS[k].label })), d.mealOption)}
          <label class="mp-label">Which days will you follow your plan?</label>
          <div class="mp-options mp-days profile-days">${dayChecks}</div>
        </section>
        <p class="mp-error" id="profileError" hidden></p>
        <div class="profile-actions">
          <button type="submit" class="cta" id="saveProfile">Save profile</button>
          <span class="profile-dirty" id="profileDirtyNote" ${profileDirty() ? "" : "hidden"}>Unsaved changes</span>
        </div>
      </form>`;

    const form = root.querySelector("#profileForm");
    const refresh = () => {
      syncProfileDraftFromForm(root);
      const derived = root.querySelector("#profileDerived");
      if (derived) derived.innerHTML = derivedTargetsHtml(profileDraft);
      root.querySelectorAll(".mp-option").forEach((row) => {
        const inp = row.querySelector("input");
        if (inp) row.classList.toggle("selected", inp.checked);
      });
      const note = root.querySelector("#profileDirtyNote");
      if (note) note.hidden = !profileDirty();
      const err = root.querySelector("#profileError");
      if (err) err.hidden = true;
    };
    form.addEventListener("input", refresh);
    form.addEventListener("change", (e) => {
      if (e.target && e.target.name === "pf-calorieMode") {
        syncProfileDraftFromForm(root);
        renderProfile(); // conditional fields: known-calories vs help path
        return;
      }
      refresh();
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      saveProfileDraft();
    });
  }

  function saveProfileDraft() {
    const root = els.profile;
    syncProfileDraftFromForm(root);
    const err = root.querySelector("#profileError");
    const msg = validateProfile(profileDraft);
    if (msg) {
      if (err) { err.hidden = false; err.textContent = msg; }
      return false;
    }
    const next = normalizeProfile(profileDraft);
    if (sameProfile(next, state.answers)) {
      profileDraft = pickProfile(state.answers);
      renderProfile();
      showNotice("No changes to save", "Your profile already matches what's saved.");
      return false;
    }
    // Only the live profile changes. planBlocks (and their snapshots), plan,
    // grocery list, coverage, inventory and order dates are left untouched.
    state.answers = next;
    state.profileUpdatedAt = new Date().toISOString();
    saveState(state);
    profileDraft = pickProfile(state.answers);
    renderProfile();
    showNotice("Profile saved 🌿", PROFILE_SAVED_MSG,
      "Use Repeat, Pick new meals, or schedule ahead to grow plans with your updated profile.");
    return true;
  }

  function showNotice(title, message, sub) {
    const old = document.getElementById("ppNotice");
    if (old) old.remove();
    const wrap = document.createElement("div");
    wrap.className = "pp-notice-backdrop";
    wrap.id = "ppNotice";
    wrap.innerHTML = `
      <div class="pp-notice" role="dialog" aria-modal="true" aria-labelledby="ppNoticeTitle">
        <img src="assets/icon-mark.png?v=leaf8" alt="" class="brand-mark" width="40" height="40" />
        <h3 id="ppNoticeTitle">${escHtml(title)}</h3>
        <p id="ppNoticeMsg">${escHtml(message)}</p>
        ${sub ? `<p class="pp-notice-sub">${escHtml(sub)}</p>` : ""}
        <button type="button" class="cta" id="ppNoticeOk">Got it</button>
      </div>`;
    const close = () => wrap.remove();
    wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
    wrap.querySelector("#ppNoticeOk").onclick = close;
    document.body.appendChild(wrap);
    try { wrap.querySelector("#ppNoticeOk").focus(); } catch (_) {}
  }

  window.addEventListener("beforeunload", (e) => {
    if ((screen === "profile" && profileDirty()) || (screen === "inventory" && inStockDirty())) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  document.getElementById("app-root").addEventListener("pureprep-goto", (e) => {
    const d = e.detail || {};
    if (d.save && d.plan) {
      // First plan (no pending offset): begin on soonest Sunday per Onboarding Drive doc.
      const fromOffset = state._pendingScheduleFromOffset != null
        ? state._pendingScheduleFromOffset
        : soonestSundayWeekOffset();
      const prevNextOrder = state.nextOrderDate;
      const prevInventory = state.inventory || [];
      const prevConfirmed = state.groceriesConfirmed;
      const prevCovered = (state.groceryCoveredWeeks || []).slice();
      const prevOrderedAt = state.lastOrderedAt;
      const prevDepleted = state.lastDepletedDate;
      // Settings this plan was generated with: the live profile for new plans,
      // or an existing week's own snapshot when updating that week.
      const planProfile = pickProfile(d.answers) || pickProfile(state.answers);
      const firstPlan = !hasCompletedProfile(state);
      const nWeeks = cadenceWeeks(planProfile && planProfile.cadence);
      const newWeeks = buildWeekStarts(fromOffset, nWeeks);
      // Never overwrite planBlocks for weeks whose groceries are already ordered.
      const coveredSet = {};
      prevCovered.forEach((w) => { coveredSet[w] = true; });
      const writableWeeks = newWeeks.filter((w) => !coveredSet[w]);
      if (!writableWeeks.length) {
        state._pendingScheduleFromOffset = null;
        saveState(state);
        setScreen(d.screen || "home");
        return;
      }
      const isAppend = fromOffset > 0 && ((state.planBlocks && state.planBlocks.length) || (state.scheduledWeeks && state.scheduledWeeks.length));

      // Questionnaire runs once: its answers become the profile only on the first
      // save. Later saves (Update / Pick new) never overwrite the profile.
      if (firstPlan || !state.answers) {
        state.answers = planProfile;
        state.profileCompleted = true;
      }
      state.plan = d.plan; // active/latest plan (grocery list & current confirm target)
      state.groceryList = d.plan.grocery || state.groceryList;
      state._pendingScheduleFromOffset = null;
      upsertPlanBlock(state, writableWeeks, d.plan, planProfile);

      if (isAppend) {
        // Pick-new / advance schedule: keep prior blocks, inventory, coverage, next order.
        state.inventory = prevInventory;
        state.groceriesConfirmed = prevConfirmed;
        state.groceryCoveredWeeks = prevCovered;
        state.lastOrderedAt = prevOrderedAt;
        state.lastDepletedDate = prevDepleted;
        state.nextOrderDate = prevNextOrder || state.nextOrderDate;
      } else {
        // First save or update of the current window: require a new grocery order
        // BEFORE the plan-start Sunday (not at the end of the cadence window).
        state.inventory = prevInventory; // keep leftovers for grocery-list credit
        state.groceriesConfirmed = false;
        state.lastOrderedAt = null;
        state.lastDepletedDate = null;
        // Drop coverage only for weeks being replaced; never clear still-covered weeks.
        const take = {};
        writableWeeks.forEach((w) => { take[w] = true; });
        state.groceryCoveredWeeks = prevCovered.filter((w) => !take[w]);
        state.nextOrderDate = weekStartISO(fromOffset);
      }
      saveState(state);
      // Land on the (first) week just scheduled — never earlier than minWeekOffset.
      weekOffset = Math.max(fromOffset, minWeekOffset(state));
    }
    setScreen(d.screen || "home");
  });

  document.getElementById("app-root").addEventListener("onboarding-complete", () => {
    // Persistence is handled by pureprep-goto (Save & close) so the profile and
    // already-scheduled weeks are never overwritten here.
  });

  document.querySelectorAll(".nav-btn").forEach((btn) => {
    btn.addEventListener("click", () => setScreen(btn.getAttribute("data-screen")));
  });

  // Small navigation hook (used by scripts/ headless tests).
  window.PurePrepApp = { go: (name, opts) => setScreen(name, opts), screen: () => screen, inStockDirty: () => inStockDirty() };

  document.body.classList.add("app-mode");
  setScreen("home");
})();

  </script>
</body>
</html>
